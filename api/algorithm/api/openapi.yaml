openapi: 3.1.0
info:
  title: Corridor Simulation API
  version: 3.0.0
  description: Deterministic synthetic corridor simulation and lane comparison.
servers:
- url: http://127.0.0.1:8000
security:
- ApiKeyAuth: []
tags:
- name: health
  description: Service health.
- name: plans
  description: Saved corridor plans.
- name: runs
  description: Deterministic simulation results.
- name: optimizations
  description: Feasible lane comparisons.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get service health
      description: Check that the service is available.
      tags:
      - health
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '400':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v3/plans:
    post:
      operationId: createCorridorPlan
      summary: Create a corridor plan
      description: Validate and save a complete immutable corridor plan.
      tags:
      - plans
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanDocument'
            example:
              schema_version: corridor-1
              name: Synthetic two-visitor scan
              geometry_revision: synthetic-corridor-v1
              route:
                nodes:
                - id: arrival
                  position:
                    x: 0
                    y: 0
                    z: 0
                - id: scan
                  position:
                    x: 0
                    y: 0
                    z: 0
                - id: admission
                  position:
                    x: 0
                    y: 0
                    z: 5
                scan_node_id: scan
              arrivals:
                count: 2
                start_seconds: 0
                end_seconds: 0
              walking_speed_mps: 1
              scan:
                lanes: 1
                physical_slots: 2
                available_staff: 2
                available_scanners: 2
                service_seconds: 10
                staff_cost_per_lane:
                  amount: '100.00'
                  currency: IDR
                scanner_cost_per_lane:
                  amount: '50.00'
                  currency: IDR
              targets:
                max_peak_scan_queue: 0
              budget:
                amount: '600.00'
                currency: IDR
              horizon_seconds: 30
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResource'
              example:
                id: pln_f25f83e3ce8646359cf02a1d476e14c6
                parent_id: null
                document:
                  schema_version: corridor-1
                  name: Synthetic two-visitor scan
                  geometry_revision: synthetic-corridor-v1
                  route:
                    nodes:
                    - id: arrival
                      position:
                        x: 0
                        y: 0
                        z: 0
                    - id: scan
                      position:
                        x: 0
                        y: 0
                        z: 5
                    - id: admission
                      position:
                        x: 0
                        y: 0
                        z: 5
                    scan_node_id: scan
                  arrivals:
                    count: 2
                    start_seconds: 0
                    end_seconds: 0
                  walking_speed_mps: 1
                  scan:
                    lanes: 1
                    physical_slots: 2
                    available_staff: 2
                    available_scanners: 2
                    service_seconds: 10
                    staff_cost_per_lane:
                      amount: '100.00'
                      currency: IDR
                    scanner_cost_per_lane:
                      amount: '50.00'
                      currency: IDR
                  targets:
                    max_peak_scan_queue: 0
                  budget:
                    amount: '600.00'
                    currency: IDR
                  horizon_seconds: 30
                snapshot_hash: 4f3a6ebb90809ea5190c15af566e1561d714048b6f655d23355ae452adf2b054
                created_at: '2026-11-07T06:26:25.012808Z'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v3/plans/{plan_id}:
    get:
      operationId: getCorridorPlan
      summary: Get a corridor plan
      description: Read a saved plan and its candidate plans.
      tags:
      - plans
      parameters:
      - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Saved plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
              example:
                id: pln_f25f83e3ce8646359cf02a1d476e14c6
                parent_id: null
                document:
                  schema_version: corridor-1
                  name: Synthetic two-visitor scan
                  geometry_revision: synthetic-corridor-v1
                  route:
                    nodes:
                    - id: arrival
                      position:
                        x: 0
                        y: 0
                        z: 0
                    - id: scan
                      position:
                        x: 0
                        y: 0
                        z: 5
                    - id: admission
                      position:
                        x: 0
                        y: 0
                        z: 5
                    scan_node_id: scan
                  arrivals:
                    count: 2
                    start_seconds: 0
                    end_seconds: 0
                  walking_speed_mps: 1
                  scan:
                    lanes: 1
                    physical_slots: 2
                    available_staff: 2
                    available_scanners: 2
                    service_seconds: 10
                    staff_cost_per_lane:
                      amount: '100.00'
                      currency: IDR
                    scanner_cost_per_lane:
                      amount: '50.00'
                      currency: IDR
                  targets:
                    max_peak_scan_queue: 0
                  budget:
                    amount: '600.00'
                    currency: IDR
                  horizon_seconds: 30
                snapshot_hash: 4f3a6ebb90809ea5190c15af566e1561d714048b6f655d23355ae452adf2b054
                created_at: '2026-11-07T06:26:25.012808Z'
                candidate_plans:
                - id: pln_58c47a8854b641809f00accd0ca09e86
                  parent_id: pln_f25f83e3ce8646359cf02a1d476e14c6
                  document:
                    schema_version: corridor-1
                    name: Synthetic two-visitor scan
                    geometry_revision: synthetic-corridor-v1
                    route:
                      nodes:
                      - id: arrival
                        position:
                          x: 0
                          y: 0
                          z: 0
                      - id: scan
                        position:
                          x: 0
                          y: 0
                          z: 5
                      - id: admission
                        position:
                          x: 0
                          y: 0
                          z: 5
                      scan_node_id: scan
                    arrivals:
                      count: 2
                      start_seconds: 0
                      end_seconds: 0
                    walking_speed_mps: 1
                    scan:
                      lanes: 2
                      physical_slots: 2
                      available_staff: 2
                      available_scanners: 2
                      service_seconds: 10
                      staff_cost_per_lane:
                        amount: '100.00'
                        currency: IDR
                      scanner_cost_per_lane:
                        amount: '50.00'
                        currency: IDR
                    targets:
                      max_peak_scan_queue: 0
                    budget:
                      amount: '600.00'
                      currency: IDR
                    horizon_seconds: 30
                  snapshot_hash: dbc6657af8e6c8ca1e288caf639150bd8839acc01a675aa772683e2cb6446aa1
                  created_at: '2026-11-07T06:26:25.032075Z'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v3/plans/{plan_id}/simulate:
    post:
      operationId: simulateCorridorPlan
      summary: Simulate a corridor plan
      description: Compute and save a deterministic Run for the saved plan.
      tags:
      - runs
      parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Simulation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResource'
              example:
                id: run_e95f71febcef47a8a4465e80c8a24251
                plan_id: pln_f25f83e3ce8646359cf02a1d476e14c6
                snapshot_hash: 4f3a6ebb90809ea5190c15af566e1561d714048b6f655d23355ae452adf2b054
                created_at: '2026-11-07T06:26:25.020586Z'
                model_id: corridor_v1
                engine_version: 1.0.0
                output:
                  population:
                    total: 2
                    admitted: 2
                    unfinished: 0
                    unfinished_by_state:
                      walking_to_scan: 0
                      queued: 0
                      scanning: 0
                      walking_to_admission: 0
                  walking:
                    route_distance_m: 5.0
                    free_flow_seconds_per_visitor: 5.0
                    total_observed_seconds: 10.0
                  scan:
                    lanes: 1
                    peak_queue: 1
                    wait_p90_seconds: 10.0
                    wait_sample_count: 2
                  costs:
                    staff:
                      amount: '100.00'
                      currency: IDR
                    equipment:
                      amount: '50.00'
                      currency: IDR
                    total:
                      amount: '150.00'
                      currency: IDR
                  checks:
                    queue_target_met: false
                    budget_met: true
                    all_admitted: true
                limitations:
                - Synthetic visitors and inputs; no personal visitor records.
                - Deterministic arrivals and service times without stochastic confidence.
                - Fixed declared route without obstacle clearance or route choice.
                - Physical slot capacity is assumed rather than geometrically verified.
                - No crowd interactions, congestion response, groups, queue switching,
                  or admission service.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
  /v3/runs/{run_id}:
    get:
      operationId: getCorridorRun
      summary: Get a corridor Run
      description: Read one persisted simulation result.
      tags:
      - runs
      parameters:
      - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Saved Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResource'
              example:
                id: run_e95f71febcef47a8a4465e80c8a24251
                plan_id: pln_f25f83e3ce8646359cf02a1d476e14c6
                snapshot_hash: 4f3a6ebb90809ea5190c15af566e1561d714048b6f655d23355ae452adf2b054
                created_at: '2026-11-07T06:26:25.020586Z'
                model_id: corridor_v1
                engine_version: 1.0.0
                output:
                  population:
                    total: 2
                    admitted: 2
                    unfinished: 0
                    unfinished_by_state:
                      walking_to_scan: 0
                      queued: 0
                      scanning: 0
                      walking_to_admission: 0
                  walking:
                    route_distance_m: 5.0
                    free_flow_seconds_per_visitor: 5.0
                    total_observed_seconds: 10.0
                  scan:
                    lanes: 1
                    peak_queue: 1
                    wait_p90_seconds: 10.0
                    wait_sample_count: 2
                  costs:
                    staff:
                      amount: '100.00'
                      currency: IDR
                    equipment:
                      amount: '50.00'
                      currency: IDR
                    total:
                      amount: '150.00'
                      currency: IDR
                  checks:
                    queue_target_met: false
                    budget_met: true
                    all_admitted: true
                limitations:
                - Synthetic visitors and inputs; no personal visitor records.
                - Deterministic arrivals and service times without stochastic confidence.
                - Fixed declared route without obstacle clearance or route choice.
                - Physical slot capacity is assumed rather than geometrically verified.
                - No crowd interactions, congestion response, groups, queue switching,
                  or admission service.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v3/plans/{plan_id}/optimize:
    post:
      operationId: optimizeCorridorPlan
      summary: Compare scan lane counts
      description: Evaluate feasible lane counts and save the best measured comparison.
      tags:
      - optimizations
      parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Lane comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResource'
              example:
                id: opt_7cef600734f64b09ac26558fbf9718f4
                plan_id: pln_f25f83e3ce8646359cf02a1d476e14c6
                created_at: '2026-11-07T06:26:25.032092Z'
                baseline_run_id: run_4b94079a8b1b49f88c16d720080ee3f7
                best_run_id: run_941575c6e31642a9b8c2fd0c061b0d64
                candidate_plan_id: pln_58c47a8854b641809f00accd0ca09e86
                improved: true
                stop_reason: completed
                evaluations:
                - lanes: 1
                  status: completed
                  score:
                  - 0
                  - 1
                  - 15000
                - lanes: 2
                  status: completed
                  score:
                  - 0
                  - 0
                  - 30000
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
  /v3/optimizations/{optimization_id}:
    get:
      operationId: getCorridorOptimization
      summary: Get a lane comparison
      description: Read a saved optimization and its result references.
      tags:
      - optimizations
      parameters:
      - $ref: '#/components/parameters/OptimizationId'
      responses:
        '200':
          description: Saved Optimization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationResource'
              example:
                id: opt_7cef600734f64b09ac26558fbf9718f4
                plan_id: pln_f25f83e3ce8646359cf02a1d476e14c6
                created_at: '2026-11-07T06:26:25.032092Z'
                baseline_run_id: run_4b94079a8b1b49f88c16d720080ee3f7
                best_run_id: run_941575c6e31642a9b8c2fd0c061b0d64
                candidate_plan_id: pln_58c47a8854b641809f00accd0ca09e86
                improved: true
                stop_reason: completed
                evaluations:
                - lanes: 1
                  status: completed
                  score:
                  - 0
                  - 1
                  - 15000
                - lanes: 2
                  status: completed
                  score:
                  - 0
                  - 0
                  - 30000
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    OptimizationId:
      name: optimization_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          const: ok
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    ValidationError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
    Money:
      additionalProperties: false
      properties:
        amount:
          pattern: ^[0-9]+\.[0-9]{2}$
          title: Amount
          type: string
        currency:
          const: IDR
          title: Currency
          type: string
      required:
      - amount
      - currency
      title: Money
      type: object
    Position:
      additionalProperties: false
      properties:
        x:
          anyOf:
          - type: integer
          - type: number
          title: X
        y:
          anyOf:
          - type: integer
          - type: number
          title: Y
        z:
          anyOf:
          - type: integer
          - type: number
          title: Z
      required:
      - x
      - y
      - z
      title: Position
      type: object
    PlanDocument:
      additionalProperties: false
      properties:
        schema_version:
          const: corridor-1
          title: Schema Version
          type: string
        name:
          minLength: 1
          title: Name
          type: string
        geometry_revision:
          minLength: 1
          title: Geometry Revision
          type: string
        route:
          $ref: '#/components/schemas/Route'
        arrivals:
          $ref: '#/components/schemas/Arrivals'
        walking_speed_mps:
          anyOf:
          - type: integer
          - type: number
          title: Walking Speed Mps
          exclusiveMinimum: 0
        scan:
          $ref: '#/components/schemas/Scan'
        targets:
          $ref: '#/components/schemas/Targets'
        budget:
          $ref: '#/components/schemas/Money'
        horizon_seconds:
          anyOf:
          - type: integer
          - type: number
          title: Horizon Seconds
          exclusiveMinimum: 0
          maximum: 86400
      required:
      - schema_version
      - name
      - geometry_revision
      - route
      - arrivals
      - walking_speed_mps
      - scan
      - targets
      - budget
      - horizon_seconds
      title: PlanDocument
      type: object
    Plan:
      type: object
      required:
      - id
      - parent_id
      - document
      - snapshot_hash
      - created_at
      properties:
        id:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        document:
          $ref: '#/components/schemas/PlanDocument'
        snapshot_hash:
          type: string
        created_at:
          type: string
          format: date-time
        candidate_plans:
          type: array
          items:
            $ref: '#/components/schemas/PlanResource'
    Node:
      additionalProperties: false
      properties:
        id:
          minLength: 1
          title: Id
          type: string
        position:
          $ref: '#/components/schemas/Position'
      required:
      - id
      - position
      title: Node
      type: object
    Route:
      additionalProperties: false
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/Node'
          maxItems: 32
          minItems: 3
          title: Nodes
          type: array
        scan_node_id:
          minLength: 1
          title: Scan Node Id
          type: string
      required:
      - nodes
      - scan_node_id
      title: Route
      type: object
    Arrivals:
      additionalProperties: false
      properties:
        count:
          maximum: 500
          minimum: 1
          title: Count
          type: integer
        start_seconds:
          anyOf:
          - type: integer
          - type: number
          title: Start Seconds
          minimum: 0
        end_seconds:
          anyOf:
          - type: integer
          - type: number
          title: End Seconds
          minimum: 0
      required:
      - count
      - start_seconds
      - end_seconds
      title: Arrivals
      type: object
    Scan:
      additionalProperties: false
      properties:
        lanes:
          maximum: 8
          minimum: 1
          title: Lanes
          type: integer
        physical_slots:
          maximum: 8
          minimum: 0
          title: Physical Slots
          type: integer
        available_staff:
          maximum: 8
          minimum: 0
          title: Available Staff
          type: integer
        available_scanners:
          maximum: 8
          minimum: 0
          title: Available Scanners
          type: integer
        service_seconds:
          anyOf:
          - type: integer
          - type: number
          title: Service Seconds
          minimum: 0
        staff_cost_per_lane:
          $ref: '#/components/schemas/Money'
        scanner_cost_per_lane:
          $ref: '#/components/schemas/Money'
      required:
      - lanes
      - physical_slots
      - available_staff
      - available_scanners
      - service_seconds
      - staff_cost_per_lane
      - scanner_cost_per_lane
      title: Scan
      type: object
    Targets:
      additionalProperties: false
      properties:
        max_peak_scan_queue:
          minimum: 0
          title: Max Peak Scan Queue
          type: integer
      required:
      - max_peak_scan_queue
      title: Targets
      type: object
    UnfinishedByState:
      additionalProperties: false
      properties:
        walking_to_scan:
          minimum: 0
          title: Walking To Scan
          type: integer
        queued:
          minimum: 0
          title: Queued
          type: integer
        scanning:
          minimum: 0
          title: Scanning
          type: integer
        walking_to_admission:
          minimum: 0
          title: Walking To Admission
          type: integer
      required:
      - walking_to_scan
      - queued
      - scanning
      - walking_to_admission
      title: UnfinishedByState
      type: object
    Population:
      additionalProperties: false
      properties:
        total:
          minimum: 0
          title: Total
          type: integer
        admitted:
          minimum: 0
          title: Admitted
          type: integer
        unfinished:
          minimum: 0
          title: Unfinished
          type: integer
        unfinished_by_state:
          $ref: '#/components/schemas/UnfinishedByState'
      required:
      - total
      - admitted
      - unfinished
      - unfinished_by_state
      title: Population
      type: object
    WalkingOutput:
      additionalProperties: false
      properties:
        route_distance_m:
          anyOf:
          - type: integer
          - type: number
          title: Route Distance M
          minimum: 0
        free_flow_seconds_per_visitor:
          anyOf:
          - type: integer
          - type: number
          title: Free Flow Seconds Per Visitor
          minimum: 0
        total_observed_seconds:
          anyOf:
          - type: integer
          - type: number
          title: Total Observed Seconds
          minimum: 0
      required:
      - route_distance_m
      - free_flow_seconds_per_visitor
      - total_observed_seconds
      title: WalkingOutput
      type: object
    ScanOutput:
      additionalProperties: false
      properties:
        lanes:
          maximum: 8
          minimum: 1
          title: Lanes
          type: integer
        peak_queue:
          minimum: 0
          title: Peak Queue
          type: integer
        wait_p90_seconds:
          anyOf:
          - anyOf:
            - type: integer
            - type: number
            minimum: 0
          - type: 'null'
          title: Wait P90 Seconds
        wait_sample_count:
          minimum: 0
          title: Wait Sample Count
          type: integer
      required:
      - lanes
      - peak_queue
      - wait_p90_seconds
      - wait_sample_count
      title: ScanOutput
      type: object
    Costs:
      additionalProperties: false
      properties:
        staff:
          $ref: '#/components/schemas/Money'
        equipment:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
      required:
      - staff
      - equipment
      - total
      title: Costs
      type: object
    Checks:
      additionalProperties: false
      properties:
        queue_target_met:
          title: Queue Target Met
          type: boolean
        budget_met:
          title: Budget Met
          type: boolean
        all_admitted:
          title: All Admitted
          type: boolean
      required:
