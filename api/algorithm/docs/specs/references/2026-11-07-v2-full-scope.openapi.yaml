  /v2/optimizations/{optimization_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/OptimizationId'
    post:
      operationId: cancelOptimization
      summary: Cancel an optimization
      description: Cancels an optimization. A queued optimization becomes cancelled at once. A running optimization
        gets a cancellation request and keeps the status running until the worker ends it; poll getOptimization
        until the status is succeeded, failed, or cancelled. Call it when the search is no longer needed. This operation
        has no request body. Empty transport and an empty JSON object use the same bodyless idempotency identity.
        A nonempty body returns 422 validation_failed before idempotency lookup; it does not create a changed-body
        conflict case.
      tags:
      - optimizations
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled optimization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Optimization'
              example:
