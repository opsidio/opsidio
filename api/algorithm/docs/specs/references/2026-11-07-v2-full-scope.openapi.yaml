  /v2/plans/{plan_id}/optimize:
    parameters:
    - $ref: '#/components/parameters/PlanId'
    post:
      operationId: optimizePlan
      summary: Optimize a plan
      description: Queue an ABM search over an immutable complete plan snapshot. All scoring, probes, candidates,
        and verification use ABM with frozen matched seeds; geometry and participant behavior remain fixed. Default
        greedy uses all five levers, 200 kept moves, and a 600-second search limit. Verification defaults to 50
        replications outside the search timer. Recommend at most one strict verified improvement. Explicit verify:null
        produces no recommendation. Poll getOptimization; llm_guided calls OpenAI only in the worker.
      tags:
      - optimizations
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeRequest'
            examples:
              default:
                summary: Default optimization method
                value:
                  optimization_method: greedy
                  levers:
                  - move_staff
                  - change_lanes
                  - open_earlier
                  - change_staff
                  - rent_equipment
                  decision_date: '2026-11-05'
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
                  scoring:
                    replications: 20
                    base_seed: 20261127
              llm_guided:
                summary: LLM-guided optimization method
                value:
                  optimization_method: llm_guided
                  levers:
                  - move_staff
                  - change_lanes
                  - open_earlier
                  - change_staff
                  - rent_equipment
                  decision_date: '2026-11-05'
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
                  scoring:
                    replications: 20
                    base_seed: 20261127
      responses:
        '202':
          description: The optimization was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Optimization'
              example:
                id: opt_01JC9Y5N2B7C4D6F8G0H2J4K6M
                plan_id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                status: queued
                error: null
                request:
                  optimization_method: greedy
                  levers:
                  - move_staff
                  - change_lanes
                  - open_earlier
                  - change_staff
                  - rent_equipment
                  decision_date: '2026-11-05'
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
                  scoring:
                    replications: 20
                    base_seed: 20261127
                progress: null
                starting_plan: null
                candidates: []
                history: []
                probes: []
                stop_reason: null
                llm: null
                created_at: '2026-11-05T08:00:00Z'
                started_at: null
                finished_at: null
                search_duration_ms: 0
                verification_duration_ms: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The plan does not exist (`plan_not_found`).
        '409':
          $ref: '#/components/responses/Conflict'
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The body fails the shape checks (`validation_failed`), the plan has validation errors (`plan_invalid`),
            or the plan breaks hard limits (`hard_limits_broken`). The `code` of each `hard_limits_broken` detail
            is the limit name. The method `llm_guided` fails with `optimization_method_unavailable` when the server
            has no OpenAI key. An unknown `optimization_method` is a `validation_failed` error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_failed:
                  summary: The body fails a check
                  value:
                    error:
                      code: validation_failed
                      message: The request has invalid fields
                      details:
                      - field: event.schedule.doors_open
                        message: Must be a time in HH:MM format
                optimization_method_unavailable:
                  summary: The server has no OpenAI key
                  value:
                    error:
                      code: optimization_method_unavailable
                      message: The optimization method llm_guided is not available on this server
