  /v2/plans/{plan_id}/validate:
    parameters:
    - $ref: '#/components/parameters/PlanId'
    post:
      operationId: validatePlan
      summary: Validate a plan
      description: Check base validity and ABM readiness separately after editing a draft. Base errors block every
        method; ABM-scoped issues block ABM and optimization, while valid legacy flow/DES remain usable. This operation
        changes nothing.
      tags:
      - plans
      responses:
        '200':
          description: The validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
              example:
                valid: false
                issues:
                - severity: error
                  code: unknown_reference
                  field: venue.layout.gates[gate_floor].lanes[female].steps[0]
                  message: Step bag_check is not in process_steps.steps
                  scope: base
                - severity: warning
                  code: hard_limit_broken
                  field: staff.roles[security_officer].count
                  message: Count 50 is above pool_limit_total 48
                  scope: base
                abm_ready: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The plan does not exist (`plan_not_found`).
  /v2/plans/{plan_id}/simulate:
    parameters:
    - $ref: '#/components/parameters/PlanId'
    post:
      operationId: simulatePlan
      summary: Simulate a plan
      description: Run a frozen plan synchronously and store its computed result. Omitted method selects ABM; explicit
        flow/DES use their genuine engines and accept valid legacy distance-only plans. ABM requires complete usable
        geometry. Reuse only a completed plain run of this plan with identical full snapshot, scenario, method,
        seeds, replications, engine version, and resolved settings. Simulation makes no model calls.
      tags:
      - runs
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
            examples:
              default_abm:
                summary: Default ABM settings
                value: {}
              abm:
                summary: Explicit ABM replications
                value:
                  simulation_method: abm
                  replications: 20
                  base_seed: 20261127
              legacy_des:
                summary: Explicit legacy DES
                value:
                  simulation_method: des
                  replications: 20
                  base_seed: 20261127
              legacy_flow:
                summary: Explicit legacy flow
                value:
                  simulation_method: flow
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                abm:
                  $ref: '#/components/examples/AbmRun'
                legacy_des:
                  $ref: '#/components/examples/Run'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The plan does not exist (`plan_not_found`).
        '409':
          $ref: '#/components/responses/Conflict'
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: Shape errors return validation_failed. Invalid ABM geometry or plan readiness returns plan_invalid
            with field, code, scope, and message. Valid geometry-free plans remain usable through explicit flow/DES.
            Supplied invalid extensions fail validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: plan_invalid
                  message: ABM requires complete geometry
                  details:
                  - field: spatial
                    code: missing_geometry
                    scope: abm
                    message: Supply usable directed geometry or explicitly select flow or des
