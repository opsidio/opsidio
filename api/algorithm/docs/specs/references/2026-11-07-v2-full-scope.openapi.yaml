          type: string
          enum:
          - accessible_visitors
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/LaneGroup'
    LaneGroup:
      type: object
      additionalProperties: true
      required:
      - group
      - count
      - steps
      properties:
        group:
          type: string
        count:
          type: integer
          minimum: 1
        serves_categories:
          $ref: '#/components/schemas/StringList'
        also_serves:
          type: string
          enum:
          - accessible_visitors
        serves:
          type: string
          enum:
          - visitors_with_exception
          - visitors_using_locker
        visitor_gender:
          $ref: '#/components/schemas/Gender'
        steps:
          $ref: '#/components/schemas/StringList'
        equipment_per_lane:
          type: object
          description: Units of each equipment item per lane.
          default: {}
          additionalProperties:
            type: integer
            minimum: 0
    WalkingPath:
      type: object
      additionalProperties: true
      required:
      - from
      - to
      - distance_m
      properties:
        from:
          type: string
        to:
          type: string
        distance_m:
          type: number
          minimum: 0
    VisitorFlowStep:
      type: object
      additionalProperties: true
      required:
      - order
      - point
      - required
      properties:
        order:
          type: integer
          minimum: 1
        point:
          type: string
        required:
          type: boolean
        when:
          type: string
        exception:
          type: string
    KnownProblem:
      type: object
      additionalProperties: true
      required:
      - id
      - linked_checks
      - conditions
      - result_template
      properties:
        id:
          type: string
        past_event:
          type: string
        problem:
          type: string
        metrics:
          $ref: '#/components/schemas/StringList'
        linked_checks:
          $ref: '#/components/schemas/StringList'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/KnownProblemCondition'
        result_template:
          type: string
        not_covered:
          type:
          - string
          - 'null'
        sources:
          $ref: '#/components/schemas/StringList'
    KnownProblemCondition:
      type: object
      additionalProperties: true
      required:
      - metric
      - operator
      - value
      properties:
        metric:
          type: string
          description: Dot path into the output document, with `[key=value]` and `[*]` selectors.
        operator:
          type: string
          enum:
          - gt
          - gte
          - lt
          - lte
        value:
          type: number
        aggregate:
          type: string
          enum:
          - max
          - min
          - sum
          - count
    ProcessSteps:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        applies_to_values:
          $ref: '#/components/schemas/FreeForm'
        outcome_values:
          $ref: '#/components/schemas/FreeForm'
        field_notes:
          $ref: '#/components/schemas/FreeForm'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
    Step:
      type: object
      additionalProperties: true
      required:
      - id
      - applies_to
      - time_per_person_seconds
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_]{1,64}$
        name:
          type: string
        what_happens:
          type: string
        done_by:
          $ref: '#/components/schemas/StringList'
        equipment:
          $ref: '#/components/schemas/StringList'
        applies_to:
          type: string
          enum:
          - all_visitors
          - visitors_with_bag
          - visitors_using_locker
          - accessible_visitors
          - visitors_with_exception
        time_per_person_seconds:
          type: object
          additionalProperties: true
          required:
          - typical
          - slow
          description: '`typical` is the median and `slow` the 90th percentile. `typical` ≤ `slow`.'
          properties:
            typical:
              type: number
              exclusiveMinimum: 0
            slow:
              type: number
              exclusiveMinimum: 0
        slow_when:
          $ref: '#/components/schemas/StringList'
        rules:
          $ref: '#/components/schemas/StringList'
        exceptions:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/StepException'
        results:
          type: object
          additionalProperties: true
          required:
          - resolved_percent
          properties:
            resolved_percent:
              $ref: '#/components/schemas/Percent'
            refused_percent:
              $ref: '#/components/schemas/Percent'
        after_resolution:
          type: string
    StepException:
      type: object
      additionalProperties: true
      required:
      - id
      - share_percent
      - outcome
      - extra_minutes
      properties:
        id:
          type: string
        what:
          type: string
        share_percent:
          $ref: '#/components/schemas/Percent'
        outcome:
          type: string
          enum:
          - continue
          - secondary_check
          - step_aside_and_return
          - help_desk
          - locker_point
          - redirect_to_correct_gate
          - back_to_redemption
          - refuse_entry
        extra_minutes:
          type: number
          minimum: 0
    Staff:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        meal_allowance_idr_per_person:
          allOf:
          - $ref: '#/components/schemas/Idr'
          default: 0
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/Shift'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Shift:
      type: object
      additionalProperties: true
      required:
      - id
      - start
      - end
      properties:
        id:
          type: string
        start:
          $ref: '#/components/schemas/ClockTime'
        end:
          $ref: '#/components/schemas/ClockTime'
        meal_break_minutes:
          type: integer
          minimum: 0
    Role:
      type: object
      additionalProperties: true
      required:
      - id
      - count
      - gender
      - shift
      - can_do
      - assignment
      description: A staff role. It needs `rate_idr_per_shift` unless `cost_model` is package; the plan validation
        checks it.
      properties:
        id:
          type: string
          pattern: ^[a-z0-9_]{1,64}$
        name:
          type: string
        provider:
          type: string
        certification:
          type: string
        processing_role:
          type: boolean
        count:
          type: integer
          minimum: 0
        gender:
          $ref: '#/components/schemas/GenderCounts'
        shift:
          type: string
        can_do:
          $ref: '#/components/schemas/StringList'
        duties:
          $ref: '#/components/schemas/StringList'
        rate_idr_per_shift:
          $ref: '#/components/schemas/Idr'
        overtime_idr_per_hour:
          $ref: '#/components/schemas/Idr'
        cost_model:
          type: string
          enum:
          - package
        package_idr:
          $ref: '#/components/schemas/Idr'
        meals_included_in_package:
          type: boolean
        pool_limit_total:
          type: integer
          minimum: 0
        pool_limit_by_gender:
          $ref: '#/components/schemas/GenderCounts'
        extra_staff_lead_time_days:
          type: integer
          minimum: 0
        assignment:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    Assignment:
      type: object
      additionalProperties: true
      required:
      - point
      - count
      description: A lane assignment has `lane_group` and `per_lane`. A duty assignment has `duty`.
      properties:
        point:
          type: string
        lane_group:
          type: string
        per_lane:
          type: integer
          minimum: 1
        duty:
          type: string
        count:
          type: integer
          minimum: 0
        gender:
          $ref: '#/components/schemas/Gender'
    Constraints:
      type: object
      additionalProperties: true
      properties:
        budget:
          $ref: '#/components/schemas/Budget'
        service_targets:
          $ref: '#/components/schemas/ServiceTargets'
        safety:
          $ref: '#/components/schemas/Safety'
        rules:
          $ref: '#/components/schemas/Rules'
        lane_staffing:
          $ref: '#/components/schemas/LaneStaffing'
        equipment:
          $ref: '#/components/schemas/Equipment'
        timing:
          $ref: '#/components/schemas/Timing'
        staffing_changes:
          $ref: '#/components/schemas/StaffingChanges'
        levers:
          $ref: '#/components/schemas/FreeForm'
        permits:
          $ref: '#/components/schemas/FreeForm'
    Budget:
      type: object
      additionalProperties: true
      required:
      - staff_cap_idr
      - equipment_cap_idr
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        staff_cap_idr:
          $ref: '#/components/schemas/Idr'
        equipment_cap_idr:
          $ref: '#/components/schemas/Idr'
        on_the_day_contingency_idr:
          $ref: '#/components/schemas/Idr'
        contingency_approved_by:
          type: string
        staff_cap_includes:
          $ref: '#/components/schemas/StringList'
        not_in_budget:
          $ref: '#/components/schemas/StringList'
    WaitTarget:
      type: object
      additionalProperties: true
      required:
      - max_minutes
      - for_share_of_visitors_percent
      properties:
        max_minutes:
          type: number
          minimum: 0
        for_share_of_visitors_percent:
          $ref: '#/components/schemas/Percent'
    ServiceTargets:
      type: object
      description: Service targets by key. The check catalog knows the typed keys; another key gets an unknown_target
        warning.
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        redemption_wait:
          $ref: '#/components/schemas/WaitTarget'
        gate_wait:
          $ref: '#/components/schemas/WaitTarget'
        longest_acceptable_wait_minutes:
          type: number
          minimum: 0
      patternProperties:
        ^([a-z0-9_]+_)?inside_before_[a-z0-9_]+_percent$:
          $ref: '#/components/schemas/Percent'
      additionalProperties:
        type:
        - number
        - object
    Safety:
      type: object
      additionalProperties: true
      required:
      - max_density_persons_per_m2
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        max_density_persons_per_m2:
          type: object
          description: Density limit by key, in persons per m2.
          properties:
            basis:
              $ref: '#/components/schemas/Basis'
          additionalProperties:
            type: number
            exclusiveMinimum: 0
        queues_must_stay_inside_queue_zones:
          type: boolean
        emergency_lane_width_m:
          type: number
          minimum: 0
        keep_clear:
          $ref: '#/components/schemas/StringList'
        rain_plan:
          type: string
        lightning_plan:
          type: string
    Rules:
      type: object
      additionalProperties: true
      required:
      - items
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
            - id
            properties:
              id:
                type: string
              rule:
                type: string
    LaneStaffing:
      type: object
      description: Minimum and maximum staff per lane, by lane_staffing key.
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
      additionalProperties:
        type: object
        additionalProperties: true
        required:
        - min_per_lane
        - max_per_lane
        properties:
          min_per_lane:
            type: integer
            minimum: 0
          max_per_lane:
            type: integer
            minimum: 0
    Equipment:
      type: object
      additionalProperties: true
      required:
      - items
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentItem'
    EquipmentItem:
      type: object
      additionalProperties: true
      required:
      - id
      - available
      - committed_cost_idr
      - extra_rentable
      allOf:
      - if:
          required:
          - extra_rentable
          properties:
            extra_rentable:
              exclusiveMinimum: 0
        then:
          required:
          - extra_cost_idr_per_unit
          - lead_time_days
          properties:
            extra_cost_idr_per_unit:
              $ref: '#/components/schemas/Idr'
            lead_time_days:
              type: integer
              minimum: 0
      - if:
          required:
          - extra_rented
          properties:
            extra_rented:
              exclusiveMinimum: 0
        then:
          required:
          - extra_cost_idr_per_unit
          properties:
            extra_cost_idr_per_unit:
              $ref: '#/components/schemas/Idr'
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        available:
          type: integer
          minimum: 0
        committed_cost_idr:
          $ref: '#/components/schemas/Idr'
        extra_rentable:
          type: integer
          minimum: 0
        extra_rented:
          type: integer
          minimum: 0
          default: 0
        extra_cost_idr_per_unit:
          $ref: '#/components/schemas/Idr'
        lead_time_days:
          type: integer
          minimum: 0
    Timing:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        redemption_open_earliest:
          $ref: '#/components/schemas/ClockTime'
        redemption_close_latest:
          $ref: '#/components/schemas/ClockTime'
        outer_area_open_earliest:
          $ref: '#/components/schemas/ClockTime'
        doors_open_earliest:
          $ref: '#/components/schemas/ClockTime'
        doors_open_earlier_needs_approval_from:
          type: string
        last_entry_latest:
          $ref: '#/components/schemas/ClockTime'
        venue_slot_end:
          $ref: '#/components/schemas/ClockTime'
    StaffingChanges:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        confirm_extra_crew_by:
          type: string
          pattern: ^D-[0-9]+$
          description: Days before the event, such as D-3.
        same_day_extra_max_people:
          type: integer
          minimum: 0
        same_day_rate_multiplier:
          type: number
          minimum: 0
    Demand:
      type: object
      additionalProperties: true
      description: Arrival and gate-join windows per ticket category. A category without an entry uses a default
        curve.
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        arrival_windows_percent:
          type: object
          description: Arrival shares by category, then by window key.
          properties:
            basis:
              $ref: '#/components/schemas/Basis'
          additionalProperties:
            type: object
            properties:
              basis:
                $ref: '#/components/schemas/Basis'
            patternProperties:
              ^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$:
                $ref: '#/components/schemas/Percent'
            additionalProperties: false
        gate_join_windows:
          type: object
          description: Gate-join window by category, or after_redemption.
          properties:
            basis:
              $ref: '#/components/schemas/Basis'
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/WindowKey'
            - type: string
              enum:
              - after_redemption
        group_size_share_percent:
          type: object
          description: Share of visitors by group size.
          properties:
            basis:
              $ref: '#/components/schemas/Basis'
          patternProperties:
            ^[1-9][0-9]?$:
              $ref: '#/components/schemas/Percent'
          additionalProperties: false
    PlanPatch:
      type: object
      additionalProperties: true
      description: JSON Merge Patch (RFC 7386) on the plan document. The server validates the merged document. Steps
        and roles have their own operations.
      properties:
        schema_version:
          type:
          - string
          - 'null'
        meta:
          type:
          - object
          - 'null'
        event:
          type:
          - object
          - 'null'
        venue:
          type:
          - object
          - 'null'
        process_steps:
          type: object
          properties:
            steps: false
        staff:
          type: object
          properties:
            roles: false
        constraints:
          type:
          - object
          - 'null'
        demand:
          type:
          - object
          - 'null'
        sources:
          type:
          - object
          - 'null'
        spatial:
          type:
          - object
          - 'null'
          description: RFC 7386 patch of the spatial extension. Null removes it; validate the merged document.
        participant_behavior:
          type:
          - object
          - 'null'
          description: RFC 7386 patch of participant segments. Null removes the extension.
    StepPatch:
      type: object
      additionalProperties: true
      description: JSON Merge Patch (RFC 7386) on one step. The ID cannot change.
      properties:
        id: false
    RolePatch:
      type: object
      additionalProperties: true
      description: JSON Merge Patch (RFC 7386) on one role. The ID cannot change.
      properties:
        id: false
    ApplyPresetRequest:
      type: object
      required:
      - preset_id
      properties:
        preset_id:
          type: string
          pattern: ^[a-z0-9_]{1,64}$
    VenuePresetSummary:
      type: object
      required:
      - id
      - name
      - summary
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
    VenuePreset:
      type: object
      required:
      - id
      - name
      - summary
      - venue
      - sources
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
        venue:
          $ref: '#/components/schemas/Venue'
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FreeForm'
    StepPresetSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    VenuePresetPage:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VenuePresetSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    StepPresetPage:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StepPresetSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    NextCursor:
      type:
      - string
      - 'null'
      description: Cursor for the next page. It is null on the last page.
    PlanSummary:
      type: object
      required:
      - id
      - parent_plan_id
      - optimization_id
      - candidate_kind
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/PlanId'
        parent_plan_id:
          oneOf:
          - $ref: '#/components/schemas/PlanId'
          - type: 'null'
        optimization_id:
          oneOf:
          - $ref: '#/components/schemas/OptimizationId'
          - type: 'null'
        candidate_kind:
          type:
          - string
          - 'null'
          enum:
          - milestone
          - final
          - finalist
          - null
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Plan:
      allOf:
      - $ref: '#/components/schemas/PlanSummary'
      - type: object
        required:
        - document
        properties:
          document:
            $ref: '#/components/schemas/PlanDocument'
    PlanPage:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlanSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          description: True when there are no base-scope errors. Does not imply ABM readiness.
        abm_ready:
          type: boolean
          description: True when base and ABM requirements pass. Optimization also requires hard limits.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
      required:
      - valid
      - abm_ready
      - issues
    SimulateRequest:
      type: object
      properties:
        simulation_method:
          $ref: '#/components/schemas/SimulationMethod'
        replications:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: ABM or DES replications, default 20. Flow resolves to one replication and ignores the requested
            seed.
        base_seed:
          type: integer
          description: Seed of replication 0. Default is the event date as YYYYMMDD. Flow ignores it.
    SimulationMethod:
      type: string
      enum:
      - abm
      - flow
      - des
      default: abm
      description: ABM is the default. Explicit flow/DES accept valid legacy distance-only plans. All supplied extensions
        must be valid.
    RunPurpose:
      type: string
      enum:
      - plain
      - start
      - probe
      - candidate
      - verification
    RunSummary:
      type: object
      required:
      - id
      - plan_id
      - optimization_id
      - purpose
      - simulation_method
      - snapshot_hash
      - reuse_key
      - reused
      - runtime_ms
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/RunId'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        optimization_id:
          oneOf:
          - $ref: '#/components/schemas/OptimizationId'
          - type: 'null'
        purpose:
          $ref: '#/components/schemas/RunPurpose'
        simulation_method:
          type: string
          enum:
          - abm
          - flow
          - des
        snapshot_hash:
          $ref: '#/components/schemas/Sha256'
          description: Hash of the full submitted immutable plan, including extensions.
        reuse_key:
          $ref: '#/components/schemas/Sha256'
        reused:
          type: boolean
          description: True when the call returned a stored run.
        runtime_ms:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Run:
      allOf:
      - $ref: '#/components/schemas/RunSummary'
      - type: object
        required:
        - output
        properties:
          output:
            $ref: '#/components/schemas/OutputDocument'
    RunPage:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Spread:
      type: object
      required:
      - mean
      - p05
      - p95
      description: Mean, fifth percentile, and 95th percentile across replications. These are distinct from population
        P90 wait metrics.
      properties:
        mean:
          type: number
        p05:
          type: number
        p95:
          type: number
    OutputDocument:
      type: object
      additionalProperties: true
      description: Computed report; illustrative examples are not engine output. Every visitor journey reconciles
        walking, queue wait, pre-opening hold, planned gate-join hold, group hold, service, and exception delay.
        Uncomputed values remain null and are listed in uncomputed_fields. Population P90 and replication percentiles
        have distinct meanings.
      required:
      - schema_version
      - meta
      - run_manifest
      - scorecard
      - known_problem_checks
      - time_to_clear
      - max_queue_length
      - wait_time
      - staff_utilization
      - staffing_cost
      - peak_density
      - bottleneck_report
      - entry_outcomes
      - support_services
      - stock_check
      - arrival_and_access
      - walking_time
      - movement_diagnostics
      properties:
        schema_version:
          type: string
          enum:
          - '0.1'
        meta:
          $ref: '#/components/schemas/FreeForm'
        run_manifest:
          $ref: '#/components/schemas/RunManifest'
        scorecard:
          $ref: '#/components/schemas/Scorecard'
        known_problem_checks:
          $ref: '#/components/schemas/KnownProblemChecks'
        time_to_clear:
          $ref: '#/components/schemas/FreeForm'
        max_queue_length:
          $ref: '#/components/schemas/FreeForm'
        wait_time:
          $ref: '#/components/schemas/FreeForm'
        staff_utilization:
          $ref: '#/components/schemas/FreeForm'
        staffing_cost:
          $ref: '#/components/schemas/FreeForm'
        peak_density:
          $ref: '#/components/schemas/FreeForm'
        bottleneck_report:
          $ref: '#/components/schemas/FreeForm'
        entry_outcomes:
          $ref: '#/components/schemas/FreeForm'
        support_services:
          $ref: '#/components/schemas/FreeForm'
        stock_check:
          $ref: '#/components/schemas/FreeForm'
        arrival_and_access:
          $ref: '#/components/schemas/FreeForm'
        walking_time:
          $ref: '#/components/schemas/WalkingTime'
        movement_diagnostics:
          oneOf:
          - $ref: '#/components/schemas/MovementDiagnostics'
          - type: 'null'
    RunManifest:
      type: object
      additionalProperties: true
      required:
      - run_id
      - plan
      - scenario
      - model
      - replications
      - idempotency_key
      - uncomputed_fields
      - simulation_method
      - extensions
      - geometry_revision
      - editor_revision
      - resolved_movement
      - effective_routes
      - method_limitations
      - runtime
      properties:
        run_id:
          $ref: '#/components/schemas/RunId'
        plan:
          type: object
          additionalProperties: true
          required:
          - plan_id
          - parent_plan_id
          - plan_hash_sha256
          properties:
            plan_id:
              $ref: '#/components/schemas/PlanId'
            parent_plan_id:
              oneOf:
              - $ref: '#/components/schemas/PlanId'
              - type: 'null'
            plan_hash_sha256:
              $ref: '#/components/schemas/Sha256'
        scenario:
          type: object
          additionalProperties: true
          required:
          - id
          properties:
            id:
              type: string
        model:
          type: object
          additionalProperties: true
          required:
          - engine_version
          properties:
            engine_version:
              type: string
        replications:
          type: object
          additionalProperties: true
          required:
          - count
          - base_seed
          properties:
            count:
              type: integer
              minimum: 1
            base_seed:
              type:
              - integer
              - 'null'
              description: Null for flow.
            input_fingerprints:
              type: array
              description: Aggregate hashes of generated synthetic attributes, keyed by replication. Excludes snapshot
                hash, engine scheduling, route choices, and operational outcomes. No visitor records are returned.
              items:
                type: object
                required:
                - replication
                - visitor_attributes_sha256
                additionalProperties: false
                properties:
                  replication:
                    type: integer
                    minimum: 0
                  visitor_attributes_sha256:
                    $ref: '#/components/schemas/Sha256'
        idempotency_key:
          $ref: '#/components/schemas/Sha256'
        uncomputed_fields:
          $ref: '#/components/schemas/StringList'
        simulation_method:
          type: string
          enum:
          - abm
          - flow
          - des
        extensions:
          type: object
          properties:
            spatial:
              oneOf:
              - $ref: '#/components/schemas/ExtensionIdentity'
              - type: 'null'
            participant_behavior:
              oneOf:
              - $ref: '#/components/schemas/ExtensionIdentity'
              - type: 'null'
          required:
          - spatial
          - participant_behavior
        geometry_revision:
          type:
          - string
          - 'null'
          description: Null for legacy geometry-free methods.
        editor_revision:
          type:
          - string
          - 'null'
          description: Revision supplied through plan metadata; null when unavailable.
        resolved_movement:
          oneOf:
          - $ref: '#/components/schemas/ResolvedMovementBehavior'
          - type: 'null'
        effective_routes:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveRoute'
        method_limitations:
          type: array
          items:
            type: string
          description: Flow/DES use static routes at 1 m/s without collision, congestion, adaptive routing, or ABM
            group cohesion.
        runtime:
          type: object
          properties:
            total_ms:
              type: integer
              minimum: 0
          required:
          - total_ms
        assumptions:
          type: object
          additionalProperties: true
          description: Source model assumptions plus movement/behavior values and provenance. Label assumed and
            estimated parameters explicitly.
        diagnostics:
          $ref: '#/components/schemas/RunDiagnostics'
      description: Complete submitted snapshot hash includes spatial/behavior extensions. Reuse identity includes
        plan, scenario, method, seeds, replications, engine version, and all resolved movement/scoring settings.
        Plain reuse is restricted to the same plan and purpose. ABM random draws exclude snapshot hash and worker
        scheduling. Record consumed extension versions/hashes separately.
    Scorecard:
      type: object
      additionalProperties: true
      required:
      - summary
      - checks
      - rule_checks
      properties:
        summary:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
        rule_checks:
          type: object
          additionalProperties: true
          required:
          - rules
          properties:
            rules:
              type: array
              items:
                type: object
                additionalProperties: true
                required:
                - rule
                - status
                properties:
                  rule:
                    type: string
                  status:
                    type: string
                    enum:
                    - pass
                    - fail
                    - not_tested
    Check:
      type: object
      additionalProperties: true
      required:
      - id
      - target_ref
      - metric
      - status
      - shortfall
      description: One service-target check. Results are numbers or distributions across ABM/DES replications. Queue-wait
        checks exclude walking and all separately reported holds.
      properties:
        id:
          type: string
        target_ref:
          type: string
        metric:
          type: string
        status:
          type: string
          enum:
          - met
          - at_risk
          - missed
        replications_met:
          type: integer
          minimum: 0
        shortfall:
          type: number
          minimum: 0
        target_idr_max:
          $ref: '#/components/schemas/Idr'
        result_idr:
          $ref: '#/components/schemas/Idr'
      patternProperties:
        ^target_.+_(max|min)$:
          type: number
        ^result_:
          oneOf:
          - type: number
          - $ref: '#/components/schemas/Spread'
    KnownProblemChecks:
      type: object
      additionalProperties: true
      required:
      - checks
      properties:
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
            - id
            - risk
            - result
            - linked_checks
            properties:
              id:
                type: string
              risk:
                type: string
                enum:
                - high
                - medium
                - low
              result:
                type: string
              linked_checks:
                $ref: '#/components/schemas/StringList'
    Lever:
      type: string
      enum:
      - move_staff
      - change_lanes
      - open_earlier
      - change_staff
      - rent_equipment
    OptimizationMethod:
      type: string
      enum:
      - greedy
      - llm_guided
      default: greedy
      description: Search strategy; greedy remains default. llm_guided uses OpenAI in the worker and requires server
        credentials. No measured holdout result exists. greedy_pairs and tabu_elite are lab-only until empirical
        promotion; add their API enum values only after promotion.
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^\d+\.\d{6}$
          description: Decimal amount with six fraction digits.
        currency:
          type: string
          enum:
          - USD
      example:
        amount: '0.012345'
        currency: USD
    VerificationChecks:
      type:
      - object
      - 'null'
      required:
      - met
      - at_risk
      - missed
      properties:
        met:
          type: integer
          minimum: 0
        at_risk:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
    OptimizeRequest:
      type: object
      properties:
        optimization_method:
          $ref: '#/components/schemas/OptimizationMethod'
        levers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Lever'
          description: The levers that moves can use. Default is all five.
        decision_date:
          type: string
          format: date
          description: The day when the planner commits changes. Default is today in Asia/Jakarta.
        max_kept_moves:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
        time_limit_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 600
        verify:
          oneOf:
          - $ref: '#/components/schemas/VerificationSettings'
          - type: 'null'
          description: Omission enables ABM verification with 50 replications and the event-date seed. Explicit
            null skips verification; no recommendation is produced.
        scoring:
          $ref: '#/components/schemas/ScoringSettings'
      description: All search, probes, candidates, and selection use ABM. Geometry and behavior stay fixed. Requires
        complete ABM readiness and all hard limits, including free compatible physical lane slots. No flow/DES fallback.
        Baseline timeout fails with scoring_timeout; later limits return the best completed state.
    Score:
      type: object
      required:
      - missed_checks
      - shortfall
      - cost_idr
      description: Plan score. The lower tuple (missed_checks, shortfall, cost_idr) wins.
      properties:
        missed_checks:
          type: integer
          minimum: 0
        shortfall:
          type: number
          minimum: 0
        cost_idr:
          type: integer
          minimum: 0
    NullableScore:
      oneOf:
      - $ref: '#/components/schemas/Score'
      - type: 'null'
    NullableRunId:
      oneOf:
      - $ref: '#/components/schemas/RunId'
      - type: 'null'
    Optimization:
      type: object
      required:
      - id
      - plan_id
      - status
      - error
      - request
      - progress
      - starting_plan
      - candidates
      - history
      - probes
      - stop_reason
      - llm
      - created_at
      - started_at
      - finished_at
      - search_duration_ms
      - verification_duration_ms
      properties:
        id:
          $ref: '#/components/schemas/OptimizationId'
        plan_id:
          $ref: '#/components/schemas/PlanId'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        error:
          type:
          - object
          - 'null'
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
        request:
          $ref: '#/components/schemas/OptimizeRequest'
          description: Resolved request including frozen scoring seeds and replication settings.
        progress:
          type:
          - object
          - 'null'
          required:
          - rounds
          - runs
          - kept_moves
          - elapsed_seconds
          - best_score
          properties:
            rounds:
              type: integer
              minimum: 0
            runs:
              type: integer
              minimum: 0
            kept_moves:
              type: integer
              minimum: 0
            elapsed_seconds:
              type: number
              minimum: 0
            best_score:
              $ref: '#/components/schemas/NullableScore'
            phase:
              type: string
              enum:
              - baseline
              - search
              - candidates
              - verification
              - complete
              description: Durable execution phase. Terminal results retain complete; cancelled/failed jobs retain
                their last phase.
            active_evaluation:
              type:
              - object
              - 'null'
              required:
              - id
              - method
              - snapshot_hash
              - replication_count
              additionalProperties: false
              properties:
                id:
                  type: string
                  minLength: 1
                method:
                  type: string
                  const: abm
                snapshot_hash:
                  $ref: '#/components/schemas/Sha256'
                replication_count:
                  type: integer
                  minimum: 1
                  maximum: 100
              description: Receipt persisted before real evaluation begins, cleared only after completion is durably
                accepted or cancellation/failure is recorded. Used for operational progress and external cancellation
                synchronization.
        starting_plan:
          type:
          - object
          - 'null'
          required:
          - snapshot_hash
          - scoring_run_id
          - verification_run_id
          - score
          - verification_checks
          - verification_shortfall
          - scoring_method
          - scoring_settings
          - verification_method
          properties:
            snapshot_hash:
              $ref: '#/components/schemas/Sha256'
            scoring_run_id:
              $ref: '#/components/schemas/NullableRunId'
            verification_run_id:
              $ref: '#/components/schemas/NullableRunId'
              description: Null unless verification completed. Never identifies an incomplete or cancelled verification.
            score:
              $ref: '#/components/schemas/NullableScore'
            verification_checks:
              $ref: '#/components/schemas/VerificationChecks'
            verification_shortfall:
              type:
              - number
              - 'null'
              minimum: 0
              description: Null without `verify`.
            scoring_method:
              type: string
              const: abm
            scoring_settings:
              $ref: '#/components/schemas/ResolvedScoringSettings'
            verification_method:
              type: string
              const: abm
              description: The configured verification method, even when verification_run_id is null.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        history:
          type: array
          items:
            type: object
            required:
            - round
            - move
            - levers
            - reason
            - score_after
            properties:
              round:
                type: integer
                minimum: 1
              move:
                type: string
                description: The move. A compound move joins its moves with ` + `.
              levers:
                type: array
                description: The levers of the move. A jump has an empty list.
                items:
                  $ref: '#/components/schemas/Lever'
              reason:
                type:
                - string
                - 'null'
                description: The reason of a kept LLM move, cut to 200 characters.
              score_after:
                $ref: '#/components/schemas/Score'
        probes:
          type: array
          items:
            type: object
            required:
            - run_id
            - change
            - used_by
            properties:
              run_id:
                $ref: '#/components/schemas/RunId'
              change:
                type: string
              used_by:
                $ref: '#/components/schemas/StringList'
        stop_reason:
          type:
          - string
          - 'null'
          description: 'Why the search ended: `no_improving_move`, `time_limit`, `max_kept_moves`, `scoring_budget`,
            or `cancelled`. The value `scoring_budget` means the method used its scoring budget. The field is null
            until the optimization ends.'
        llm:
          oneOf:
          - $ref: '#/components/schemas/LlmRecord'
          - type: 'null'
          description: The LLM record. It is null for every other method.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        search_duration_ms:
          type: integer
          minimum: 0
          description: Search duration, excluding verification; zero before search starts.
        verification_duration_ms:
          type: integer
          minimum: 0
          description: Verification duration, measured separately; zero when not started or skipped.
    Candidate:
      type: object
      required:
      - plan_id
      - kind
      - recommended
      - kept_moves
      - score
      - verification_checks
      - verification_shortfall
      - scoring_run_id
      - verification_run_id
      - diff
      - scoring_method
      - scoring_settings
      - verification_method
      properties:
        plan_id:
          $ref: '#/components/schemas/PlanId'
        kind:
          type: string
          enum:
          - milestone
          - final
          - finalist
        recommended:
          type: boolean
          description: True for at most one finalist and only after completed matched ABM verification strictly
            beats baseline by (missed checks, at-risk checks, shortfall, measured cost). Finalist ties prefer fewer
            kept moves. False without verification or after cancellation.
        kept_moves:
          type: integer
          minimum: 0
        score:
          $ref: '#/components/schemas/Score'
        verification_checks:
          $ref: '#/components/schemas/VerificationChecks'
        verification_shortfall:
          type:
          - number
          - 'null'
          minimum: 0
          description: Null without `verify`.
        scoring_run_id:
          $ref: '#/components/schemas/RunId'
          description: Full ABM candidate run. Verification uses a separate run.
        verification_run_id:
          $ref: '#/components/schemas/NullableRunId'
          description: Null unless verification completed. Never identifies an incomplete or cancelled verification.
        diff:
          type: array
          items:
            type: object
            required:
            - path
            - old
            - new
            - lever
            - approval_needed
            properties:
              path:
                type: string
              old: {}
              new: {}
              lever:
                $ref: '#/components/schemas/Lever'
              approval_needed:
                type:
                - string
                - 'null'
        scoring_method:
          type: string
          const: abm
        scoring_settings:
          $ref: '#/components/schemas/ResolvedScoringSettings'
        verification_method:
          type: string
          const: abm
          description: The configured verification method, even when verification_run_id is null.
    LlmRecord:
      type: object
      required:
      - model
      - reasoning_effort
      - fallback_rounds
      - estimated_cost
      - stop_reason
      - calls
      properties:
        model:
          type: string
        reasoning_effort:
          type: string
        fallback_rounds:
          type: integer
          minimum: 0
        estimated_cost:
          $ref: '#/components/schemas/Money'
        stop_reason:
          type:
          - string
          - 'null'
          enum:
          - call_limit
          - cost_cap
          - consecutive_failures
          - spend_limit
          - auth_error
          - no_key
          - null
        calls:
          type: array
          items:
            $ref: '#/components/schemas/LlmCall'
    LlmCall:
      type: object
      required:
      - round
      - status
      - request_id
      - input_tokens
      - cached_input_tokens
      - output_tokens
      - latency_ms
      - estimated_cost
      - llm_moves
      properties:
        round:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - ok
          - timeout
          - refused
          - incomplete
          - invalid
          - api_error
          - spend_limit
          - auth_error
          description: 'The outcome of the call.

            - `ok`: the model returned moves that parse.

            - `timeout`: the call ran out of time.

            - `refused`: the model refused the request.

            - `incomplete`: the model stopped before it finished the answer.

            - `invalid`: the answer does not parse or holds no valid move.

            - `api_error`: OpenAI returned an error.

            - `spend_limit`: the spend limit of the OpenAI project stopped the call.

            - `auth_error`: OpenAI rejected the key.'
        request_id:
          type:
          - string
          - 'null'
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        estimated_cost:
          $ref: '#/components/schemas/Money'
        llm_moves:
          type: array
          items:
            type: object
            required:
            - moves
            - reason
            - score
            - kept
            properties:
              moves:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
              reason:
                type: string
              score:
                $ref: '#/components/schemas/NullableScore'
              kept:
                type: boolean
    OptimizationPage:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Optimization'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable snake_case code that clients match on.
            message:
              type: string
              description: Explanation for people.
            details:
              type: array
              description: Field errors. Only 422 responses include it. For plan_invalid, `code` is the issue code;
                for hard_limits_broken, it is the limit name.
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                  scope:
                    type: string
                    enum:
                    - base
                    - abm
                    - flow
                    - des
                    - optimization
    Position:
      type: object
      properties:
        x:
          type: number
          description: Finite coordinate in metres.
        y:
          type: number
          description: Finite coordinate in metres.
        z:
          type: number
          description: Finite coordinate in metres.
      required:
      - x
      - y
      - z
      additionalProperties: false
    CoordinateFrame:
      type: object
      properties:
        units:
          type: string
          const: metres
        x_axis:
          type: string
          const: east
        y_axis:
          type: string
          const: up
        z_axis:
          type: string
          const: south
        geographic_origin:
          type: object
          properties:
            longitude:
              type: number
              minimum: -180
              maximum: 180
            latitude:
              type: number
              minimum: -90
              maximum: 90
            basis:
              $ref: '#/components/schemas/Basis'
            source:
              type: string
          required:
          - longitude
          - latitude
      required:
      - units
      - x_axis
      - y_axis
      - z_axis
      additionalProperties: false
    NavigationNode:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        position:
          $ref: '#/components/schemas/Position'
      required:
      - id
      - position
      additionalProperties: false
    LocalWindow:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/ClockTime'
        end:
          $ref: '#/components/schemas/ClockTime'
      required:
      - start
      - end
      additionalProperties: false
      description: Ordered local clock interval on the event date, in its timezone. Start precedes end; intervals
        must not overlap.
    SpatialEdge:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        from_node_id:
          type: string
          minLength: 1
        to_node_id:
          type: string
          minLength: 1
        width_m:
          type: number
          exclusiveMinimum: 0
        physical_corridor_id:
          type: string
          minLength: 1
        accessible:
          type: boolean
        zone_id:
          type: string
          minLength: 1
        allowed_category_ids:
          type: array
          items:
            type: string
            minLength: 1
          uniqueItems: true
        polyline:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          minItems: 2
        closure_windows:
          type: array
          items:
            $ref: '#/components/schemas/LocalWindow'
      required:
      - id
      - from_node_id
      - to_node_id
      - width_m
      - physical_corridor_id
      - accessible
      - zone_id
      additionalProperties: false
      description: Directed horizontal walkable corridor. Polyline endpoints must match nodes. Length follows the
        polyline or endpoints. Opposite edges share physical_corridor_id and occupancy. Projected crossings require
        shared junctions unless explicitly separated. Empty allowed_category_ids permits no category; omission permits
        all eligible categories.
    SpatialBinding:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - zone
          - gate
          - service_point
        node_id:
          type: string
          minLength: 1
      required:
      - id
      - kind
      - node_id
      additionalProperties: false
      description: The id identifies the existing logical zone, gate, or service point, not a new resource.
    LaneSlot:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        point_id:
          type: string
          minLength: 1
        permitted_lane_groups:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        entry_node_id:
          type: string
          minLength: 1
        exit_node_id:
          type: string
          minLength: 1
      required:
      - id
      - point_id
      - permitted_lane_groups
      - entry_node_id
      - exit_node_id
      additionalProperties: false
      description: Stable physical lane location, including inactive capacity. Active lane matching is deterministic
        and one-to-one. Optimization cannot invent slots or change their coordinates.
    StepPlacement:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        lane_slot_id:
          type: string
          minLength: 1
        point_id:
          type: string
          minLength: 1
        lane_group:
          type: string
          minLength: 1
        step_id:
          type: string
          minLength: 1
        node_id:
          type: string
          minLength: 1
      required:
      - id
      - lane_slot_id
      - point_id
      - lane_group
      - step_id
      - node_id
      additionalProperties: false
      description: A physical step occurrence in a lane slot. Each required occurrence must be placed. Distinct
        occurrences may share a node, producing zero walking distance.
    MovementBehavior:
      type: object
      properties:
        version:
          type: integer
          const: 1
          description: Extension version; unsupported versions return a field-level 422.
        desired_speed_mean_mps:
          type: number
          exclusiveMinimum: 0
          default: 1.0
        desired_speed_stddev_mps:
          type: number
          minimum: 0
          default: 0.1
        desired_speed_min_mps:
          type: number
          exclusiveMinimum: 0
          default: 0.2
        desired_speed_max_mps:
          type: number
          exclusiveMinimum: 0
          default: 2.0
        accessible_speed_multiplier:
          type: number
          exclusiveMinimum: 0
          default: 0.75
        body_radius_m:
          type: number
          exclusiveMinimum: 0
          default: 0.25
        group_cohesion_distance_m:
          type: number
          exclusiveMinimum: 0
          default: 2.0
        movement_tick_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 0.25
          default: 0.25
        jam_density_persons_per_m2:
          type: number
          exclusiveMinimum: 0
          default: 4.0
        provenance:
          $ref: '#/components/schemas/BehaviorProvenance'
      required:
      - version
      additionalProperties: false
      description: Editable modeling assumptions, not venue calibration or safety thresholds. Speed uses a truncated
        normal; zero SD gives fixed speed. Require min <= mean <= max. Congestion multiplies desired speed by max(0,
        1-density/jam_density), excluding the current visitor. Resolved defaults are recorded in run identity.
      example:
        version: 1
        desired_speed_mean_mps: 1.0
        desired_speed_stddev_mps: 0.1
        desired_speed_min_mps: 0.2
        desired_speed_max_mps: 2.0
        accessible_speed_multiplier: 0.75
        body_radius_m: 0.25
        group_cohesion_distance_m: 2.0
        movement_tick_seconds: 0.25
        jam_density_persons_per_m2: 4.0
        provenance:
          basis: assumed
    BehaviorProvenance:
      type: object
      properties:
        basis:
          $ref: '#/components/schemas/Basis'
        source:
          type: string
        revision:
          type: string
      required:
      - basis
      additionalProperties: false
    ResolvedMovementBehavior:
      type: object
      properties:
        version:
          type: integer
          const: 1
          description: Extension version; unsupported versions return a field-level 422.
        desired_speed_mean_mps:
          type: number
          exclusiveMinimum: 0
        desired_speed_stddev_mps:
          type: number
          minimum: 0
        desired_speed_min_mps:
          type: number
          exclusiveMinimum: 0
        desired_speed_max_mps:
          type: number
          exclusiveMinimum: 0
        accessible_speed_multiplier:
          type: number
          exclusiveMinimum: 0
        body_radius_m:
          type: number
          exclusiveMinimum: 0
        group_cohesion_distance_m:
          type: number
          exclusiveMinimum: 0
        movement_tick_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 0.25
        jam_density_persons_per_m2:
          type: number
          exclusiveMinimum: 0
      required:
      - version
      - desired_speed_mean_mps
      - desired_speed_stddev_mps
      - desired_speed_min_mps
      - desired_speed_max_mps
      - accessible_speed_multiplier
      - body_radius_m
      - group_cohesion_distance_m
      - movement_tick_seconds
      - jam_density_persons_per_m2
      additionalProperties: false
    SegmentBehavior:
      type: object
      properties:
        desired_speed_mean_mps:
          type: number
          exclusiveMinimum: 0
          default: 1.0
        desired_speed_stddev_mps:
          type: number
          minimum: 0
          default: 0.1
        desired_speed_min_mps:
          type: number
          exclusiveMinimum: 0
          default: 0.2
        desired_speed_max_mps:
          type: number
          exclusiveMinimum: 0
          default: 2.0
        accessible_speed_multiplier:
          type: number
          exclusiveMinimum: 0
          default: 0.75
        body_radius_m:
          type: number
          exclusiveMinimum: 0
          default: 0.25
        group_cohesion_distance_m:
          type: number
          exclusiveMinimum: 0
          default: 2.0
      required: []
      additionalProperties: false
      description: Optional segment overrides of global behavior. Segment values take precedence. All settings remain
        fixed during optimization.
    Spatial:
      type: object
      properties:
        version:
          type: integer
          const: 1
          description: Extension version; unsupported versions return a field-level 422.
        geometry_revision:
          type: string
          minLength: 1
        coordinate_frame:
          $ref: '#/components/schemas/CoordinateFrame'
        arrival_point:
          type: object
          properties:
            node_id:
              type: string
              minLength: 1
          required:
          - node_id
          additionalProperties: false
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NavigationNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SpatialEdge'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/SpatialBinding'
        lane_slots:
          type: array
          items:
            $ref: '#/components/schemas/LaneSlot'
        step_placements:
          type: array
          items:
            $ref: '#/components/schemas/StepPlacement'
        behavior:
          $ref: '#/components/schemas/MovementBehavior'
      required:
      - version
      additionalProperties: false
      description: Optional versioned geometry in the submitted snapshot. Drafts may omit geometry parts. ABM readiness
        requires coordinate frame, revision, default arrival, unique nodes/edges/bindings/slots/placements, and
        every required directed route, including exception returns and destinations. Reject nonfinite coordinates,
        elevation-changing edges, invalid references, impossible clearance, and disconnected required movements.
        Validate scheduled closures. Never invent geometry for legacy plans.
      example:
        version: 1
        geometry_revision: illustrative-corridor-1
        coordinate_frame:
          units: metres
          x_axis: east
          y_axis: up
          z_axis: south
        arrival_point:
          node_id: arrival
        nodes:
        - id: arrival
          position:
            x: 0
            y: 0
            z: 0
        - id: scan
          position:
            x: 3
            y: 0
            z: 4
        edges:
        - id: arrival_to_scan
          from_node_id: arrival
          to_node_id: scan
          width_m: 1.2
          physical_corridor_id: approach
          accessible: true
          zone_id: zone_forecourt
        bindings:
        - id: redemption_tent
          kind: service_point
          node_id: scan
        lane_slots:
        - id: scan_slot_1
          point_id: redemption_tent
          permitted_lane_groups:
          - general
          entry_node_id: scan
          exit_node_id: scan
        step_placements:
        - id: scan_occurrence_1
          lane_slot_id: scan_slot_1
          point_id: redemption_tent
          lane_group: general
          step_id: eticket_scan
          node_id: scan
        behavior:
          version: 1
          desired_speed_stddev_mps: 0
          provenance:
            basis: assumed
            source: Illustrative shape; not frozen GBK geometry
    ParticipantSegment:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        category_id:
          type: string
          minLength: 1
        share_within_category_percent:
          $ref: '#/components/schemas/Percent'
        arrival_shares_percent:
          type: array
          items:
            $ref: '#/components/schemas/Percent'
          minItems: 1
        arrival_node_id:
          type: string
          minLength: 1
        behavior:
          $ref: '#/components/schemas/SegmentBehavior'
        provenance:
          $ref: '#/components/schemas/BehaviorProvenance'
      required:
      - id
      - category_id
      - share_within_category_percent
      - arrival_shares_percent
      - arrival_node_id
      - provenance
      additionalProperties: false
      description: Synthetic population segment. Arrival shares correspond by index to time_bins and sum to 100%.
        Configured segment shares within each category sum to 100%. Groups arrive together. No personal records
        are accepted.
    ParticipantBehavior:
      type: object
      properties:
        version:
          type: integer
          const: 1
          description: Extension version; unsupported versions return a field-level 422.
        time_bins:
          type: array
          items:
            $ref: '#/components/schemas/LocalWindow'
          minItems: 1
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantSegment'
          minItems: 1
      required:
      - version
      - time_bins
      - segments
      additionalProperties: false
      description: Shared ordered non-overlapping local event bins. Each segment must provide exactly one share
        per bin. ABM consumes segment identity and arrival node directly; flow/DES use weighted category curves.
        Unconfigured categories retain demand/defaults and the default arrival point.
      example:
        version: 1
        time_bins:
        - start: '14:30'
          end: '15:30'
        - start: '15:30'
          end: '16:30'
        segments:
        - id: early_arrivals
          category_id: festival_a
          share_within_category_percent: 100
          arrival_shares_percent:
          - 60
          - 40
          arrival_node_id: arrival
          provenance:
            basis: estimate
            source: Illustrative segment assumptions
    ValidationIssue:
      type: object
      properties:
        severity:
          type: string
          enum:
          - error
          - warning
        code:
          type: string
          description: Stable snake_case issue code. Spatial/behavior issues include unsupported_extension_version,
            missing_geometry, unknown_reference, unreachable_route, invalid_coordinate, invalid_width, invalid_arrival_shares,
            invalid_crossing, and insufficient_lane_slots.
        field:
          type: string
          description: Dot path; keyed array items use [id or group], otherwise [index].
        message:
          type: string
        scope:
          type: string
          enum:
          - base
          - abm
          - flow
          - des
          - optimization
      required:
      - severity
      - code
      - field
      - message
      - scope
    ScoringSettings:
      type: object
      properties:
        replications:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        base_seed:
          type: integer
          description: Defaults to event date YYYYMMDD. Fixed matched seed schedule for all states; replication
            i uses base_seed+i.
      required: []
      additionalProperties: false
      description: ABM scoring settings. Omitted settings resolve to 20 replications and event-date seed. Evaluation
        budgets count states, not replications. Frozen settings are stored in the optimization request.
      example:
        replications: 20
        base_seed: 20261127
    ResolvedScoringSettings:
      type: object
      properties:
        replications:
          type: integer
          minimum: 1
          maximum: 100
        base_seed:
          type: integer
      required:
      - replications
      - base_seed
      additionalProperties: false
    VerificationSettings:
      type: object
      properties:
        replications:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        base_seed:
          type: integer
          description: Defaults to the event date YYYYMMDD; shared across baseline and finalists.
      required: []
      additionalProperties: false
      description: ABM finalist verification after search, outside the search timer. Default 50 replications. Null
        verify skips verification and recommendations.
      example:
        replications: 50
        base_seed: 20261127
    EffectiveRoute:
      type: object
      properties:
        from_id:
          type: string
          minLength: 1
        to_id:
          type: string
          minLength: 1
        edge_ids:
          type: array
          items:
            type: string
            minLength: 1
        distance_m:
          type: number
          minimum: 0
      required:
      - from_id
      - to_id
      - edge_ids
      - distance_m
      additionalProperties: false
      description: Compiled directed route. Geometry replaces the bound legacy distance; distances are never added
        twice.
    ExtensionIdentity:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
      required:
      - version
      - sha256
      additionalProperties: false
    WalkingSummary:
      type: object
      properties:
        distance_m:
          $ref: '#/components/schemas/Spread'
        free_flow_time_seconds:
          $ref: '#/components/schemas/Spread'
        observed_movement_time_seconds:
          $ref: '#/components/schemas/Spread'
        movement_delay_seconds:
          $ref: '#/components/schemas/Spread'
      required:
      - distance_m
      - free_flow_time_seconds
      - observed_movement_time_seconds
      - movement_delay_seconds
      additionalProperties: false
      description: Population totals per replication summarized across replications. Observed movement includes
        congestion pauses, excludes queues/service/holds, and equals free-flow time plus movement delay.
    WalkingRoute:
      type: object
      properties:
        from_node_id:
          type: string
          minLength: 1
        to_node_id:
          type: string
          minLength: 1
        edge_ids:
          type: array
          items:
            type: string
            minLength: 1
        summary:
          $ref: '#/components/schemas/WalkingSummary'
      required:
      - from_node_id
      - to_node_id
      - edge_ids
      - summary
      additionalProperties: false
    WalkingTime:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/WalkingSummary'
        by_route:
          type: array
          items:
            $ref: '#/components/schemas/WalkingRoute'
      required:
      - total
      - by_route
      additionalProperties: false
    MovementDiagnostics:
      type: object
      properties:
        collision_violations:
          $ref: '#/components/schemas/Spread'
        blocked_route_unfinished_visitors:
          $ref: '#/components/schemas/Spread'
        route_changes:
          $ref: '#/components/schemas/Spread'
        group_holds:
          $ref: '#/components/schemas/Spread'
        group_hold_seconds:
          $ref: '#/components/schemas/Spread'
      required:
      - collision_violations
      - blocked_route_unfinished_visitors
      - route_changes
      - group_holds
      - group_hold_seconds
      additionalProperties: false
      description: Computed ABM diagnostics across replications; valid collision fixtures report zero violations.
        Group hold is separate from queue wait.
    RunDiagnostics:
      type: object
      required:
      - version
      - measurements
      additionalProperties: false
      properties:
        version:
          type: integer
          const: 1
        measurements:
          type: object
          description: Aggregate audit measurements keyed by the frozen semantic metric catalog. Numeric summaries
            use Spread; scalar strings are used only for single-valued outcomes. No individual trace or personal
            data.
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/Spread'
            - type:
              - number
              - string
              - 'null'
      description: Computed movement/service eligibility and accounting diagnostics. Bindings and reduction rules
        are frozen in the acceptance data. Unavailable values are null and listed in uncomputed_fields.
  responses:
    Unauthorized:
      description: The X-API-Key header is missing or wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_api_key
              message: Invalid or missing API key
    NotFound:
      description: The item does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: plan_not_found
              message: Plan pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B does not exist
    Conflict:
      description: The request conflicts with the current state, or reuses an Idempotency-Key with a different body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: idempotency_key_reused
              message: This Idempotency-Key was used with a different request body
    PayloadTooLarge:
      description: The request body is larger than 1 MB (1,048,576 bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: body_too_large
              message: The request body is larger than 1 MB
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_failed
              message: The request has invalid fields
              details:
              - field: event.schedule.doors_open
                message: Must be a time in HH:MM format
    TooManyRequests:
      description: Five optimizations are queued or running.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: optimization_queue_full
              message: Five optimizations are queued or running
