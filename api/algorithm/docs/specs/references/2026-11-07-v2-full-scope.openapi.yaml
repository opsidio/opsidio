                  - change_lanes
                  - open_earlier
                  - change_staff
                  - rent_equipment
                  decision_date: '2026-11-05'
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify: null
                  scoring:
                    replications: 20
                    base_seed: 20261127
                progress: null
                starting_plan: null
                candidates: []
                history: []
                probes: []
                stop_reason: null
                llm: null
                created_at: '2026-11-05T08:00:00Z'
                started_at: null
                finished_at: '2026-11-05T08:00:03Z'
                search_duration_ms: 0
                verification_duration_ms: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: The optimization does not exist (`optimization_not_found`).
        '409':
          $ref: '#/components/responses/Conflict'
          description: The optimization already ended (`optimization_finished`), or the Idempotency-Key was used
            with a different body (`idempotency_key_reused`).
        '422':
          $ref: '#/components/responses/ValidationError'
          description: The Idempotency-Key header is invalid (`validation_failed`).
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items on one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The next_cursor value from the previous page. Leave it out for the first page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: A unique value for each create request, such as a UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PlanId:
      name: plan_id
      in: path
      required: true
      description: Plan ID.
      schema:
        type: string
        pattern: ^pln_[0-9A-HJKMNP-TV-Z]{26}$
      example: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
    RunId:
      name: run_id
      in: path
      required: true
      description: Run ID.
      schema:
