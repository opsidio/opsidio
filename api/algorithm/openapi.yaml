  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    PlanId:
      type: string
      pattern: "^pln_[0-9A-HJKMNP-TV-Z]{26}$"
    RunId:
      type: string
      pattern: "^run_[0-9A-HJKMNP-TV-Z]{26}$"
    OptimizationId:
      type: string
      pattern: "^opt_[0-9A-HJKMNP-TV-Z]{26}$"
    Sha256:
      type: string
      pattern: "^[0-9a-f]{64}$"
    Timestamp:
      type: string
      format: date-time
    Idr:
      type: integer
      minimum: 0
      description: Amount in whole IDR.
    ClockTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Local time in Asia/Jakarta, "HH:MM".
    Percent:
      type: number
      minimum: 0
      maximum: 100
    WindowKey:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$'
      description: Time window "HH:MM-HH:MM".
    Basis:
      type: string
      enum: [confirmed, policy, estimate, public_source, assumed]
    FreeForm:
      type: object
      additionalProperties: true
      description: An object with any content.
    StringList:
      type: array
      items:
        type: string
    Gender:
      type: string
      enum: [female, male]
    GenderCounts:
      type: object
      additionalProperties: true
      required: [female, male]
      properties:
        female:
          type: integer
          minimum: 0
        male:
          type: integer
          minimum: 0
    PlanDocument:
      type: object
      additionalProperties: true
      description: >-
        The plan document, in the tree of the example input file. Every part is
        optional, because a planner builds a plan in parts. validatePlan checks
        the rules across parts.
      properties:
        schema_version:
          type: string
          enum: ["0.1"]
        meta:
          $ref: "#/components/schemas/FreeForm"
        event:
          $ref: "#/components/schemas/Event"
        venue:
          $ref: "#/components/schemas/Venue"
        process_steps:
          $ref: "#/components/schemas/ProcessSteps"
        staff:
          $ref: "#/components/schemas/Staff"
        constraints:
          $ref: "#/components/schemas/Constraints"
        demand:
          $ref: "#/components/schemas/Demand"
        sources:
          type: object
          description: Source entries by source ID.
          additionalProperties:
            $ref: "#/components/schemas/FreeForm"
    Event:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        venue:
          type: string
        date:
          type: string
          format: date
        day_of_week:
          type: string
          enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        public_holiday:
          type: boolean
        schedule:
          $ref: "#/components/schemas/EventSchedule"
        capacity:
          $ref: "#/components/schemas/EventCapacity"
        pricing:
          $ref: "#/components/schemas/FreeForm"
        ticket_categories:
          type: array
          items:
            $ref: "#/components/schemas/TicketCategory"
        entry_policy:
          $ref: "#/components/schemas/FreeForm"
        audience_profile:
          $ref: "#/components/schemas/AudienceProfile"
        nearby_events_same_day:
          $ref: "#/components/schemas/FreeForm"
    EventSchedule:
      type: object
      additionalProperties: true
      required: [outer_area_open, doors_open, main_act]
      description: Event moments. A service target can name any moment key.
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        supervisor_call:
          $ref: "#/components/schemas/ClockTime"
        crew_briefing:
          $ref: "#/components/schemas/ClockTime"
        redemption_open:
          $ref: "#/components/schemas/ClockTime"
        outer_area_open:
          $ref: "#/components/schemas/ClockTime"
        priority_gate_open:
          $ref: "#/components/schemas/ClockTime"
        doors_open:
          $ref: "#/components/schemas/ClockTime"
        opening_act:
          $ref: "#/components/schemas/ClockTime"
        main_act:
          $ref: "#/components/schemas/ClockTime"
        show_end_estimate:
          $ref: "#/components/schemas/ClockTime"
        redemption_close:
          $ref: "#/components/schemas/ClockTime"
        last_entry:
          $ref: "#/components/schemas/ClockTime"
    EventCapacity:
      type: object
      additionalProperties: true
      required: [no_show_percent_estimate]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        venue_full_capacity:
          type: integer
          minimum: 0
        configured_capacity:
          type: integer
          minimum: 0
        tickets_on_sale:
          type: integer
          minimum: 0
        guest_invitations:
          type: integer
          minimum: 0
        tickets_sold:
          type: integer
          minimum: 0
        tickets_sold_as_of:
          type: string
          format: date
        no_show_percent_estimate:
          $ref: "#/components/schemas/Percent"
    TicketCategory:
      type: object
      additionalProperties: true
      required: [id, admission, entry_gate]
      description: >-
        A ticket category. It needs `sold`, or `issued` when `complimentary` is
        true; the plan validation checks it.
      properties:
        id:
          type: string
        name:
          type: string
        admission:
          type: string
          enum: [standing, seated]
        price_idr:
          $ref: "#/components/schemas/Idr"
        quota:
          type: integer
          minimum: 0
        sold:
          type: integer
          minimum: 0
        issued:
          type: integer
          minimum: 0
        complimentary:
          type: boolean
        entry_gate:
          type: string
        zone:
          type: string
          description: "Destination zone for density. Default: zone_<category_id>, if that zone exists."
    AudienceProfile:
      type: object
      additionalProperties: true
      required:
        - female_percent
        - typical_group_size
        - arrive_in_groups_percent
        - visitors_with_bag_percent
        - visitors_using_locker_percent
        - accessible_visitors_percent
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        core_age_min:
          type: integer
          minimum: 0
        core_age_max:
          type: integer
          minimum: 0
        female_percent:
          $ref: "#/components/schemas/Percent"
        typical_group_size:
          type: integer
          minimum: 1
        arrive_in_groups_percent:
          $ref: "#/components/schemas/Percent"
        visitors_with_bag_percent:
          $ref: "#/components/schemas/Percent"
        visitors_using_locker_percent:
          $ref: "#/components/schemas/Percent"
        accessible_visitors_percent:
          $ref: "#/components/schemas/Percent"
        arrival_mode_percent:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Percent"
        arrival_notes:
          $ref: "#/components/schemas/StringList"
    Venue:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        building:
          $ref: "#/components/schemas/FreeForm"
        venue_rules:
          $ref: "#/components/schemas/FreeForm"
        access:
          $ref: "#/components/schemas/FreeForm"
        neighbors:
          $ref: "#/components/schemas/FreeForm"
        layout:
          $ref: "#/components/schemas/VenueLayout"
        known_problems:
          type: array
          items:
            $ref: "#/components/schemas/KnownProblem"
    VenueLayout:
      type: object
      additionalProperties: true
      required: [zones, service_points, gates, walking_paths, visitor_flow]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        service_points:
          type: array
          items:
            $ref: "#/components/schemas/ServicePoint"
        gates:
          type: array
          items:
            $ref: "#/components/schemas/Gate"
        walking_paths:
          type: array
          items:
            $ref: "#/components/schemas/WalkingPath"
        visitor_flow:
          type: array
          items:
            $ref: "#/components/schemas/VisitorFlowStep"
        exceptions_go_to:
          type: string
          description: The point that receives the help_desk outcome.
    Zone:
      type: object
      additionalProperties: true
      required: [id, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [drop_off, holding, service, queue, standing, seating]
        area_m2:
          type: number
          exclusiveMinimum: 0
        length_m:
          type: number
          minimum: 0
        covered_percent:
          $ref: "#/components/schemas/Percent"
        barricade_m:
          type: number
          minimum: 0
        switchback_rows:
          type: integer
          minimum: 0
        seats:
          type: integer
          minimum: 0
        wheelchair_places:
          type: integer
          minimum: 0
    ServicePoint:
      type: object
      additionalProperties: true
      required: [id, zone, queue_zone, opens, closes, max_lanes, lanes]
      properties:
        id:
          type: string
        name:
          type: string
        zone:
          type: string
        queue_zone:
          type: string
        opens:
          $ref: "#/components/schemas/ClockTime"
        closes:
          $ref: "#/components/schemas/ClockTime"
        max_lanes:
          type: integer
          minimum: 1
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/LaneGroup"
    Gate:
      type: object
      additionalProperties: true
      required: [id, queue_zone, leads_to, opens, closes, max_lanes, serves_categories, lanes]
      properties:
        id:
          type: string
        name:
          type: string
        queue_zone:
          type: string
        leads_to:
          $ref: "#/components/schemas/StringList"
        opens:
          $ref: "#/components/schemas/ClockTime"
        closes:
          $ref: "#/components/schemas/ClockTime"
        frontage_m:
          type: number
          minimum: 0
        max_lanes:
          type: integer
          minimum: 1
        serves_categories:
          $ref: "#/components/schemas/StringList"
        also_serves:
          type: string
          enum: [accessible_visitors]
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/LaneGroup"
    LaneGroup:
      type: object
      additionalProperties: true
      required: [group, count, steps]
      properties:
        group:
          type: string
        count:
          type: integer
          minimum: 1
        serves_categories:
          $ref: "#/components/schemas/StringList"
        also_serves:
          type: string
          enum: [accessible_visitors]
        serves:
          type: string
          enum: [visitors_with_exception, visitors_using_locker]
        visitor_gender:
          $ref: "#/components/schemas/Gender"
        steps:
          $ref: "#/components/schemas/StringList"
        equipment_per_lane:
          type: object
          description: Units of each equipment item per lane.
          default: {}
          additionalProperties:
            type: integer
            minimum: 0
    WalkingPath:
      type: object
      additionalProperties: true
      required: [from, to, distance_m]
      properties:
        from:
          type: string
        to:
          type: string
        distance_m:
          type: number
          minimum: 0
    VisitorFlowStep:
      type: object
      additionalProperties: true
      required: [order, point, required]
      properties:
        order:
          type: integer
          minimum: 1
        point:
          type: string
        required:
          type: boolean
        when:
          type: string
        exception:
          type: string
    KnownProblem:
      type: object
      additionalProperties: true
      required: [id, linked_checks, conditions, result_template]
      properties:
        id:
          type: string
        past_event:
          type: string
        problem:
          type: string
        metrics:
          $ref: "#/components/schemas/StringList"
        linked_checks:
          $ref: "#/components/schemas/StringList"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/KnownProblemCondition"
        result_template:
          type: string
        not_covered:
          type: [string, "null"]
        sources:
          $ref: "#/components/schemas/StringList"
    KnownProblemCondition:
      type: object
      additionalProperties: true
      required: [metric, operator, value]
      properties:
        metric:
          type: string
          description: Dot path into the output document, with `[key=value]` and `[*]` selectors.
        operator:
          type: string
          enum: [gt, gte, lt, lte]
        value:
          type: number
        aggregate:
          type: string
          enum: [max, min, sum, count]
    ProcessSteps:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        applies_to_values:
          $ref: "#/components/schemas/FreeForm"
        outcome_values:
          $ref: "#/components/schemas/FreeForm"
        field_notes:
          $ref: "#/components/schemas/FreeForm"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    Step:
      type: object
      additionalProperties: true
      required: [id, applies_to, time_per_person_seconds]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{1,64}$"
        name:
          type: string
        what_happens:
          type: string
        done_by:
          $ref: "#/components/schemas/StringList"
        equipment:
          $ref: "#/components/schemas/StringList"
        applies_to:
          type: string
          enum: [all_visitors, visitors_with_bag, visitors_using_locker, accessible_visitors, visitors_with_exception]
        time_per_person_seconds:
          type: object
          additionalProperties: true
          required: [typical, slow]
          description: "`typical` is the median and `slow` the 90th percentile. `typical` ≤ `slow`."
          properties:
            typical:
              type: number
              exclusiveMinimum: 0
            slow:
              type: number
              exclusiveMinimum: 0
        slow_when:
          $ref: "#/components/schemas/StringList"
        rules:
          $ref: "#/components/schemas/StringList"
        exceptions:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/StepException"
        results:
          type: object
          additionalProperties: true
          required: [resolved_percent]
          properties:
            resolved_percent:
              $ref: "#/components/schemas/Percent"
            refused_percent:
              $ref: "#/components/schemas/Percent"
        after_resolution:
          type: string
    StepException:
      type: object
      additionalProperties: true
      required: [id, share_percent, outcome, extra_minutes]
      properties:
        id:
          type: string
        what:
          type: string
        share_percent:
          $ref: "#/components/schemas/Percent"
        outcome:
          type: string
          enum:
            - continue
            - secondary_check
            - step_aside_and_return
            - help_desk
            - locker_point
            - redirect_to_correct_gate
            - back_to_redemption
            - refuse_entry
        extra_minutes:
          type: number
          minimum: 0
    Staff:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        meal_allowance_idr_per_person:
          allOf:
            - $ref: "#/components/schemas/Idr"
          default: 0
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Shift:
      type: object
      additionalProperties: true
      required: [id, start, end]
      properties:
        id:
          type: string
        start:
          $ref: "#/components/schemas/ClockTime"
        end:
          $ref: "#/components/schemas/ClockTime"
        meal_break_minutes:
          type: integer
          minimum: 0
    Role:
      type: object
      additionalProperties: true
      required: [id, count, gender, shift, can_do, assignment]
      description: >-
        A staff role. It needs `rate_idr_per_shift` unless `cost_model` is
        package; the plan validation checks it.
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]{1,64}$"
        name:
          type: string
        provider:
          type: string
        certification:
          type: string
        processing_role:
          type: boolean
        count:
          type: integer
          minimum: 0
        gender:
          $ref: "#/components/schemas/GenderCounts"
        shift:
          type: string
        can_do:
          $ref: "#/components/schemas/StringList"
        duties:
          $ref: "#/components/schemas/StringList"
        rate_idr_per_shift:
          $ref: "#/components/schemas/Idr"
        overtime_idr_per_hour:
          $ref: "#/components/schemas/Idr"
        cost_model:
          type: string
          enum: [package]
        package_idr:
          $ref: "#/components/schemas/Idr"
        meals_included_in_package:
          type: boolean
        pool_limit_total:
          type: integer
          minimum: 0
        pool_limit_by_gender:
          $ref: "#/components/schemas/GenderCounts"
        extra_staff_lead_time_days:
          type: integer
          minimum: 0
        assignment:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
    Assignment:
      type: object
      additionalProperties: true
      required: [point, count]
      description: A lane assignment has `lane_group` and `per_lane`. A duty assignment has `duty`.
      properties:
        point:
          type: string
        lane_group:
          type: string
        per_lane:
          type: integer
          minimum: 1
        duty:
          type: string
        count:
          type: integer
          minimum: 0
        gender:
          $ref: "#/components/schemas/Gender"
    Constraints:
      type: object
      additionalProperties: true
      properties:
        budget:
          $ref: "#/components/schemas/Budget"
        service_targets:
          $ref: "#/components/schemas/ServiceTargets"
        safety:
          $ref: "#/components/schemas/Safety"
        rules:
          $ref: "#/components/schemas/Rules"
        lane_staffing:
          $ref: "#/components/schemas/LaneStaffing"
        equipment:
          $ref: "#/components/schemas/Equipment"
        timing:
          $ref: "#/components/schemas/Timing"
        staffing_changes:
          $ref: "#/components/schemas/StaffingChanges"
        levers:
          $ref: "#/components/schemas/FreeForm"
        permits:
          $ref: "#/components/schemas/FreeForm"
    Budget:
      type: object
      additionalProperties: true
      required: [staff_cap_idr, equipment_cap_idr]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        staff_cap_idr:
          $ref: "#/components/schemas/Idr"
        equipment_cap_idr:
          $ref: "#/components/schemas/Idr"
        on_the_day_contingency_idr:
          $ref: "#/components/schemas/Idr"
        contingency_approved_by:
          type: string
        staff_cap_includes:
          $ref: "#/components/schemas/StringList"
        not_in_budget:
          $ref: "#/components/schemas/StringList"
    WaitTarget:
      type: object
      additionalProperties: true
      required: [max_minutes, for_share_of_visitors_percent]
      properties:
        max_minutes:
          type: number
          minimum: 0
        for_share_of_visitors_percent:
          $ref: "#/components/schemas/Percent"
    ServiceTargets:
      type: object
      description: Service targets by key. The check catalog knows the typed keys; another key gets an unknown_target warning.
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        redemption_wait:
          $ref: "#/components/schemas/WaitTarget"
        gate_wait:
          $ref: "#/components/schemas/WaitTarget"
        longest_acceptable_wait_minutes:
          type: number
          minimum: 0
      patternProperties:
        "^([a-z0-9_]+_)?inside_before_[a-z0-9_]+_percent$":
          $ref: "#/components/schemas/Percent"
      additionalProperties:
        type: [number, object]
    Safety:
      type: object
      additionalProperties: true
      required: [max_density_persons_per_m2]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        max_density_persons_per_m2:
          type: object
          description: Density limit by key, in persons per m2.
          properties:
            basis:
              $ref: "#/components/schemas/Basis"
          additionalProperties:
            type: number
            exclusiveMinimum: 0
        queues_must_stay_inside_queue_zones:
          type: boolean
        emergency_lane_width_m:
          type: number
          minimum: 0
        keep_clear:
          $ref: "#/components/schemas/StringList"
        rain_plan:
          type: string
        lightning_plan:
          type: string
    Rules:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id]
            properties:
              id:
                type: string
              rule:
                type: string
    LaneStaffing:
      type: object
      description: Minimum and maximum staff per lane, by lane_staffing key.
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
      additionalProperties:
        type: object
        additionalProperties: true
        required: [min_per_lane, max_per_lane]
        properties:
          min_per_lane:
            type: integer
            minimum: 0
          max_per_lane:
            type: integer
            minimum: 0
    Equipment:
      type: object
      additionalProperties: true
      required: [items]
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EquipmentItem"
    EquipmentItem:
      type: object
      additionalProperties: true
      required: [id, available, committed_cost_idr, extra_rentable]
      allOf:
        - if:
            required: [extra_rentable]
            properties:
              extra_rentable:
                exclusiveMinimum: 0
          then:
            required: [extra_cost_idr_per_unit, lead_time_days]
            properties:
              extra_cost_idr_per_unit:
                $ref: "#/components/schemas/Idr"
              lead_time_days:
                type: integer
                minimum: 0
        - if:
            required: [extra_rented]
            properties:
              extra_rented:
                exclusiveMinimum: 0
          then:
            required: [extra_cost_idr_per_unit]
            properties:
              extra_cost_idr_per_unit:
                $ref: "#/components/schemas/Idr"
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        available:
          type: integer
          minimum: 0
        committed_cost_idr:
          $ref: "#/components/schemas/Idr"
        extra_rentable:
          type: integer
          minimum: 0
        extra_rented:
          type: integer
          minimum: 0
          default: 0
        extra_cost_idr_per_unit:
          $ref: "#/components/schemas/Idr"
        lead_time_days:
          type: integer
          minimum: 0
    Timing:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        redemption_open_earliest:
          $ref: "#/components/schemas/ClockTime"
        redemption_close_latest:
          $ref: "#/components/schemas/ClockTime"
        outer_area_open_earliest:
          $ref: "#/components/schemas/ClockTime"
        doors_open_earliest:
          $ref: "#/components/schemas/ClockTime"
        doors_open_earlier_needs_approval_from:
          type: string
        last_entry_latest:
          $ref: "#/components/schemas/ClockTime"
        venue_slot_end:
          $ref: "#/components/schemas/ClockTime"
    StaffingChanges:
      type: object
      additionalProperties: true
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        confirm_extra_crew_by:
          type: string
          pattern: "^D-[0-9]+$"
          description: Days before the event, such as D-3.
        same_day_extra_max_people:
          type: integer
          minimum: 0
        same_day_rate_multiplier:
          type: number
          minimum: 0
    Demand:
      type: object
      additionalProperties: true
      description: Arrival and gate-join windows per ticket category. A category without an entry uses a default curve.
      properties:
        basis:
          $ref: "#/components/schemas/Basis"
        arrival_windows_percent:
          type: object
          description: Arrival shares by category, then by window key.
          properties:
            basis:
              $ref: "#/components/schemas/Basis"
          additionalProperties:
            type: object
            properties:
              basis:
                $ref: "#/components/schemas/Basis"
            patternProperties:
              '^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$':
                $ref: "#/components/schemas/Percent"
            additionalProperties: false
        gate_join_windows:
          type: object
          description: Gate-join window by category, or after_redemption.
          properties:
            basis:
              $ref: "#/components/schemas/Basis"
          additionalProperties:
            anyOf:
              - $ref: "#/components/schemas/WindowKey"
              - type: string
                enum: [after_redemption]
        group_size_share_percent:
          type: object
          description: Share of visitors by group size.
          properties:
            basis:
              $ref: "#/components/schemas/Basis"
          patternProperties:
            "^[1-9][0-9]?$":
              $ref: "#/components/schemas/Percent"
          additionalProperties: false
    PlanPatch:
      type: object
      additionalProperties: true
      description: >-
        JSON Merge Patch (RFC 7386) on the plan document. The server validates
        the merged document. Steps and roles have their own operations.
      properties:
        schema_version:
          type: [string, "null"]
        meta:
          type: [object, "null"]
        event:
          type: [object, "null"]
        venue:
          type: [object, "null"]
        process_steps:
          type: object
          properties:
            steps: false
        staff:
          type: object
          properties:
            roles: false
        constraints:
          type: [object, "null"]
        demand:
          type: [object, "null"]
        sources:
          type: [object, "null"]
    StepPatch:
      type: object
      additionalProperties: true
      description: JSON Merge Patch (RFC 7386) on one step. The ID cannot change.
      properties:
        id: false
    RolePatch:
      type: object
      additionalProperties: true
      description: JSON Merge Patch (RFC 7386) on one role. The ID cannot change.
      properties:
        id: false
    ApplyPresetRequest:
      type: object
      required: [preset_id]
      properties:
        preset_id:
          type: string
          pattern: "^[a-z0-9_]{1,64}$"
    VenuePresetSummary:
      type: object
      required: [id, name, summary]
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
    VenuePreset:
      type: object
      required: [id, name, summary, venue, sources]
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
        venue:
          $ref: "#/components/schemas/Venue"
        sources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FreeForm"
    StepPresetSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    VenuePresetPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VenuePresetSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    StepPresetPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StepPresetSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    NextCursor:
      type: [string, "null"]
      description: Cursor for the next page. It is null on the last page.
    PlanSummary:
      type: object
      required: [id, parent_plan_id, optimization_id, candidate_kind, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/PlanId"
        parent_plan_id:
          oneOf:
            - $ref: "#/components/schemas/PlanId"
            - type: "null"
        optimization_id:
          oneOf:
            - $ref: "#/components/schemas/OptimizationId"
            - type: "null"
        candidate_kind:
          type: [string, "null"]
          enum: [milestone, final, finalist, null]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Plan:
      allOf:
        - $ref: "#/components/schemas/PlanSummary"
        - type: object
          required: [document]
          properties:
            document:
              $ref: "#/components/schemas/PlanDocument"
    PlanPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ValidationResult:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
          description: True when the plan has no errors. Warnings do not block a run.
        issues:
          type: array
          items:
            type: object
            required: [severity, code, field, message]
            properties:
              severity:
                type: string
                enum: [error, warning]
              code:
                type: string
              field:
                type: string
                description: Dot path. A list item appears as [<id or group>], else [<index>].
              message:
                type: string
    SimulateRequest:
      type: object
      properties:
        simulation_method:
          $ref: "#/components/schemas/SimulationMethod"
        replications:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Des replications. Flow always uses 1.
        base_seed:
          type: integer
          description: Seed of replication 0. Default is the event date as YYYYMMDD. Flow ignores it.
    SimulationMethod:
      type: string
      enum: [flow, des]
      default: flow
    RunPurpose:
      type: string
      enum: [plain, start, probe, candidate, verification]
    RunSummary:
      type: object
      required: [id, plan_id, optimization_id, purpose, simulation_method, snapshot_hash, reuse_key, reused, runtime_ms, created_at]
      properties:
        id:
          $ref: "#/components/schemas/RunId"
        plan_id:
          $ref: "#/components/schemas/PlanId"
        optimization_id:
          oneOf:
            - $ref: "#/components/schemas/OptimizationId"
            - type: "null"
        purpose:
          $ref: "#/components/schemas/RunPurpose"
        simulation_method:
          type: string
          enum: [flow, des]
        snapshot_hash:
          $ref: "#/components/schemas/Sha256"
        reuse_key:
          $ref: "#/components/schemas/Sha256"
        reused:
          type: boolean
          description: True when the call returned a stored run.
        runtime_ms:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Run:
      allOf:
        - $ref: "#/components/schemas/RunSummary"
        - type: object
          required: [output]
          properties:
            output:
              $ref: "#/components/schemas/OutputDocument"
    RunPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Spread:
      type: object
      required: [mean, p05, p95]
      description: Mean and 5th and 95th percentiles over the des replications.
      properties:
        mean:
          type: number
        p05:
          type: number
        p95:
          type: number
    OutputDocument:
      type: object
      additionalProperties: true
      description: The output document, in the tree of the example output file (spec §9).
      required:
        - schema_version
        - meta
        - run_manifest
        - scorecard
        - known_problem_checks
        - time_to_clear
        - max_queue_length
        - wait_time
        - staff_utilization
        - staffing_cost
        - peak_density
        - bottleneck_report
        - entry_outcomes
        - support_services
        - stock_check
        - arrival_and_access
      properties:
        schema_version:
          type: string
          enum: ["0.1"]
        meta:
          $ref: "#/components/schemas/FreeForm"
        run_manifest:
          $ref: "#/components/schemas/RunManifest"
        scorecard:
          $ref: "#/components/schemas/Scorecard"
        known_problem_checks:
          $ref: "#/components/schemas/KnownProblemChecks"
        time_to_clear:
          $ref: "#/components/schemas/FreeForm"
        max_queue_length:
          $ref: "#/components/schemas/FreeForm"
        wait_time:
          $ref: "#/components/schemas/FreeForm"
        staff_utilization:
          $ref: "#/components/schemas/FreeForm"
        staffing_cost:
          $ref: "#/components/schemas/FreeForm"
        peak_density:
          $ref: "#/components/schemas/FreeForm"
        bottleneck_report:
          $ref: "#/components/schemas/FreeForm"
        entry_outcomes:
          $ref: "#/components/schemas/FreeForm"
        support_services:
          $ref: "#/components/schemas/FreeForm"
        stock_check:
          $ref: "#/components/schemas/FreeForm"
        arrival_and_access:
          $ref: "#/components/schemas/FreeForm"
    RunManifest:
      type: object
      additionalProperties: true
      required: [run_id, plan, scenario, model, replications, idempotency_key, uncomputed_fields]
      properties:
        run_id:
          $ref: "#/components/schemas/RunId"
        plan:
          type: object
          additionalProperties: true
          required: [plan_id, parent_plan_id, plan_hash_sha256]
          properties:
            plan_id:
              $ref: "#/components/schemas/PlanId"
            parent_plan_id:
              oneOf:
                - $ref: "#/components/schemas/PlanId"
                - type: "null"
            plan_hash_sha256:
              $ref: "#/components/schemas/Sha256"
        scenario:
          type: object
          additionalProperties: true
          required: [id]
          properties:
            id:
              type: string
        model:
          type: object
          additionalProperties: true
          required: [engine_version]
          properties:
            engine_version:
              type: string
        replications:
          type: object
          additionalProperties: true
          required: [count, base_seed]
          properties:
            count:
              type: integer
              minimum: 1
            base_seed:
              type: [integer, "null"]
              description: Null for flow.
        idempotency_key:
          $ref: "#/components/schemas/Sha256"
        uncomputed_fields:
          $ref: "#/components/schemas/StringList"
    Scorecard:
      type: object
      additionalProperties: true
      required: [summary, checks, rule_checks]
      properties:
        summary:
          type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"
        rule_checks:
          type: object
          additionalProperties: true
          required: [rules]
          properties:
            rules:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [rule, status]
                properties:
                  rule:
                    type: string
                  status:
                    type: string
                    enum: [pass, fail, not_tested]
    Check:
      type: object
      additionalProperties: true
      required: [id, target_ref, metric, status, shortfall]
      description: >-
        One service-target check. `target_*` fields hold the target, and
        `result_*` fields the result: a number for flow and computed checks, a
        Spread for des.
      properties:
        id:
          type: string
        target_ref:
          type: string
        metric:
          type: string
        status:
          type: string
          enum: [met, at_risk, missed]
        replications_met:
          type: integer
          minimum: 0
        shortfall:
          type: number
          minimum: 0
        target_idr_max:
          $ref: "#/components/schemas/Idr"
        result_idr:
          $ref: "#/components/schemas/Idr"
      patternProperties:
        "^target_.+_(max|min)$":
          type: number
        "^result_":
          oneOf:
            - type: number
            - $ref: "#/components/schemas/Spread"
    KnownProblemChecks:
      type: object
      additionalProperties: true
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, risk, result, linked_checks]
            properties:
              id:
                type: string
              risk:
                type: string
                enum: [high, medium, low]
              result:
                type: string
              linked_checks:
                $ref: "#/components/schemas/StringList"
    Lever:
      type: string
      enum: [move_staff, change_lanes, open_earlier, change_staff, rent_equipment]
    OptimizationMethod:
      type: string
      enum: [greedy, llm_guided]
      default: greedy
      description: |-
        The method that searches for a better plan.
        - `greedy`: scores every single move in each round and keeps the best one. It is the default.
        - `llm_guided`: asks an OpenAI model for moves, and the simulator scores them. It needs the `OPENAI_API_KEY` of the server. No holdout result exists yet.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: Decimal amount with six fraction digits.
        currency:
          type: string
          enum: [USD]
      example:
        amount: "0.012345"
        currency: USD
    DesChecks:
      type: [object, "null"]
      required: [met, at_risk, missed]
      properties:
        met:
          type: integer
          minimum: 0
        at_risk:
          type: integer
          minimum: 0
        missed:
          type: integer
          minimum: 0
    OptimizeRequest:
      type: object
      properties:
        optimization_method:
          $ref: "#/components/schemas/OptimizationMethod"
        levers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Lever"
          description: The levers that moves can use. Default is all five.
        decision_date:
          type: string
          format: date
          description: The day when the planner commits changes. Default is today in Asia/Jakarta.
        max_kept_moves:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
        time_limit_seconds:
          type: integer
          minimum: 10
          maximum: 1800
          default: 600
        verify:
          type: [object, "null"]
          description: Des verification and des selection after the search. Null skips des selection, so no candidate is recommended.
          properties:
            replications:
              type: integer
              minimum: 1
              maximum: 100
              default: 50
            base_seed:
              type: integer
    Score:
      type: object
      required: [missed_checks, shortfall, cost_idr]
      description: Plan score. The lower tuple (missed_checks, shortfall, cost_idr) wins.
      properties:
        missed_checks:
          type: integer
          minimum: 0
        shortfall:
          type: number
          minimum: 0
        cost_idr:
          type: integer
          minimum: 0
    NullableScore:
      oneOf:
        - $ref: "#/components/schemas/Score"
        - type: "null"
    NullableRunId:
      oneOf:
        - $ref: "#/components/schemas/RunId"
        - type: "null"
    Optimization:
      type: object
      required:
        - id
        - plan_id
        - status
        - error
        - request
        - progress
        - starting_plan
        - candidates
        - history
        - probes
        - stop_reason
        - llm
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          $ref: "#/components/schemas/OptimizationId"
        plan_id:
          $ref: "#/components/schemas/PlanId"
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        error:
          type: [object, "null"]
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        request:
          $ref: "#/components/schemas/OptimizeRequest"
        progress:
          type: [object, "null"]
          required: [rounds, runs, kept_moves, elapsed_seconds, best_score]
          properties:
            rounds:
              type: integer
              minimum: 0
            runs:
              type: integer
              minimum: 0
            kept_moves:
              type: integer
              minimum: 0
            elapsed_seconds:
              type: number
              minimum: 0
            best_score:
              $ref: "#/components/schemas/NullableScore"
        starting_plan:
          type: [object, "null"]
          required: [snapshot_hash, flow_run_id, des_run_id, score, des_checks, des_shortfall]
          properties:
            snapshot_hash:
              $ref: "#/components/schemas/Sha256"
            flow_run_id:
              $ref: "#/components/schemas/NullableRunId"
            des_run_id:
              $ref: "#/components/schemas/NullableRunId"
            score:
              $ref: "#/components/schemas/NullableScore"
            des_checks:
              $ref: "#/components/schemas/DesChecks"
            des_shortfall:
              type: [number, "null"]
              minimum: 0
              description: Null without `verify`.
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        history:
          type: array
          items:
            type: object
            required: [round, move, levers, reason, score_after]
            properties:
              round:
                type: integer
                minimum: 1
              move:
                type: string
                description: The move. A compound move joins its moves with ` + `.
              levers:
                type: array
                description: The levers of the move. A jump has an empty list.
                items:
                  $ref: "#/components/schemas/Lever"
              reason:
                type: [string, "null"]
                description: The reason of a kept LLM move, cut to 200 characters.
              score_after:
                $ref: "#/components/schemas/Score"
        probes:
          type: array
          items:
            type: object
            required: [run_id, change, used_by]
            properties:
              run_id:
                $ref: "#/components/schemas/RunId"
              change:
                type: string
              used_by:
                $ref: "#/components/schemas/StringList"
        stop_reason:
          type: [string, "null"]
          description: >-
            Why the search ended: `no_improving_move`, `time_limit`,
            `max_kept_moves`, `scoring_budget`, or `cancelled`. The value
            `scoring_budget` means the method used its scoring budget. The
            field is null until the optimization ends.
        llm:
          oneOf:
            - $ref: "#/components/schemas/LlmRecord"
            - type: "null"
          description: The LLM record. It is null for every other method.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    Candidate:
      type: object
      required: [plan_id, kind, recommended, kept_moves, score, des_checks, des_shortfall, flow_run_id, des_run_id, diff]
      properties:
        plan_id:
          $ref: "#/components/schemas/PlanId"
        kind:
          type: string
          enum: [milestone, final, finalist]
        recommended:
          type: boolean
          description: At most one candidate of an optimization is true.
        kept_moves:
          type: integer
          minimum: 0
        score:
          $ref: "#/components/schemas/Score"
        des_checks:
          $ref: "#/components/schemas/DesChecks"
        des_shortfall:
          type: [number, "null"]
          minimum: 0
          description: Null without `verify`.
        flow_run_id:
          $ref: "#/components/schemas/RunId"
        des_run_id:
          $ref: "#/components/schemas/NullableRunId"
        diff:
          type: array
          items:
            type: object
            required: [path, old, new, lever, approval_needed]
            properties:
              path:
                type: string
              old: {}
              new: {}
              lever:
                $ref: "#/components/schemas/Lever"
              approval_needed:
                type: [string, "null"]
    LlmRecord:
      type: object
      required: [model, reasoning_effort, fallback_rounds, estimated_cost, stop_reason, calls]
      properties:
        model:
          type: string
        reasoning_effort:
          type: string
        fallback_rounds:
          type: integer
          minimum: 0
        estimated_cost:
          $ref: "#/components/schemas/Money"
        stop_reason:
          type: [string, "null"]
          enum: [call_limit, cost_cap, consecutive_failures, spend_limit, auth_error, no_key, null]
        calls:
          type: array
          items:
            $ref: "#/components/schemas/LlmCall"
    LlmCall:
      type: object
      required: [round, status, request_id, input_tokens, cached_input_tokens, output_tokens, latency_ms, estimated_cost, llm_moves]
      properties:
        round:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ok, timeout, refused, incomplete, invalid, api_error, spend_limit, auth_error]
          description: |-
            The outcome of the call.
            - `ok`: the model returned moves that parse.
            - `timeout`: the call ran out of time.
            - `refused`: the model refused the request.
            - `incomplete`: the model stopped before it finished the answer.
            - `invalid`: the answer does not parse or holds no valid move.
            - `api_error`: OpenAI returned an error.
            - `spend_limit`: the spend limit of the OpenAI project stopped the call.
            - `auth_error`: OpenAI rejected the key.
        request_id:
          type: [string, "null"]
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        estimated_cost:
          $ref: "#/components/schemas/Money"
        llm_moves:
          type: array
          items:
            type: object
            required: [moves, reason, score, kept]
            properties:
              moves:
                type: array
                minItems: 1
                maxItems: 3
                items:
                  type: string
              reason:
                type: string
              score:
                $ref: "#/components/schemas/NullableScore"
              kept:
                type: boolean
    OptimizationPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Optimization"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case code that clients match on.
            message:
              type: string
              description: Explanation for people.
            details:
              type: array
              description: >-
                Field errors. Only 422 responses include it. For plan_invalid,
                `code` is the issue code; for hard_limits_broken, it is the limit
                name.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
  responses:
    Unauthorized:
      description: The X-API-Key header is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_api_key
              message: Invalid or missing API key
    NotFound:
      description: The item does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: plan_not_found
              message: Plan pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B does not exist
    Conflict:
      description: The request conflicts with the current state, or reuses an Idempotency-Key with a different body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: idempotency_key_reused
              message: This Idempotency-Key was used with a different request body
    PayloadTooLarge:
      description: The request body is larger than 1 MB (1,048,576 bytes).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: body_too_large
              message: The request body is larger than 1 MB
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_failed
              message: The request has invalid fields
              details:
                - field: event.schedule.doors_open
                  message: Must be a time in HH:MM format
    TooManyRequests:
      description: Five optimizations are queued or running.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: optimization_queue_full
              message: Five optimizations are queued or running
