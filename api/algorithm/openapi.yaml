                  schema_version: "0.1"
                  process_steps:
                    steps:
                      - id: eticket_scan
                        name: E-ticket scan
                        applies_to: all_visitors
                        time_per_person_seconds:
                          typical: 6
                          slow: 25
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the step preset (`preset_not_found`) does not exist.
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            The plan already has a step with the preset's ID (`step_exists`), or
            the Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The body fails the shape checks (`validation_failed`).
  /v1/plans/{plan_id}/validate:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: validatePlan
      summary: Validate a plan
      description: >-
        Runs the rules across parts and returns every error and warning. Call
        it after you build the plan, and before simulatePlan or optimizePlan.
        Errors block a run. It changes nothing.
      tags: [plans]
      responses:
        "200":
          description: The validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
              example:
                valid: false
                issues:
                  - severity: error
                    code: unknown_reference
                    field: venue.layout.gates[gate_floor].lanes[female].steps[0]
                    message: Step bag_check is not in process_steps.steps
                  - severity: warning
                    code: hard_limit_broken
                    field: staff.roles[security_officer].count
                    message: Count 50 is above pool_limit_total 48
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
  /v1/plans/{plan_id}/simulate:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: simulatePlan
      summary: Simulate a plan
      description: >-
        Runs a snapshot of the plan with the flow method (default) or the des
        method, and stores the run. A second call for the same plan with the
        same snapshot and settings returns the plan's stored run with `reused`
        true. Call it to see queues, waits, costs, and the scorecard of the plan.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
            example:
              simulation_method: des
              replications: 20
              base_seed: 20261127
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
              examples:
                run:
                  $ref: "#/components/examples/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: >-
            The body fails the shape checks (`validation_failed`), or the plan has
            validation errors (`plan_invalid`). The `code` of each `plan_invalid`
            detail is the issue code.
  /v1/plans/{plan_id}/runs:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: listRuns
      summary: List the runs of a plan
      description: >-
        Returns the plan's runs without their output documents, newest first.
        Filter by `purpose` to find plain runs or the runs of an optimization.
        Call getRun for the output. It changes nothing.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: purpose
          in: query
          description: Return only runs with this purpose.
          schema:
            $ref: "#/components/schemas/RunPurpose"
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
              example:
                data:
                  - id: run_01JC9X0A1B2C3D4E5F6G7H8J9K
                    plan_id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                    optimization_id: null
                    purpose: plain
                    simulation_method: des
                    snapshot_hash: ba21dbc1dd9eefd3683f15d4fc36e8ede76c58af9b044e0738026ef2ac07be6e
                    reuse_key: 4287b21792950bbf19e7068a914ebd19e6245e4e9450cf8323bc918cedd44473
                    reused: false
                    runtime_ms: 5203
                    created_at: "2026-11-05T07:53:10Z"
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The `limit`, `cursor`, or `purpose` query parameter is invalid (`validation_failed`).
  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get a run
      description: >-
        Returns one run with its output document. Call it to read the results
        of a run that listRuns or an optimization names. It changes nothing.
      tags: [runs]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
              examples:
                run:
                  $ref: "#/components/examples/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The run does not exist (`run_not_found`).
  /v1/plans/{plan_id}/optimize:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: optimizePlan
      summary: Optimize a plan
      description: >-
        Queues a search for a better plan on a snapshot of the plan. The
        search uses the chosen optimization method (default `greedy`). When
        `verify` is set, des selection then picks the recommended plan from
        the finalists. The method `llm_guided` calls OpenAI in the worker.
        Later edits do not change the search. Poll getOptimization for the
        progress and the candidate plans. Call it when the plan has no
        validation errors and breaks no hard limit.
      tags: [optimizations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
            examples:
              default:
                summary: Default optimization method
                value:
                  optimization_method: greedy
                  levers: [move_staff, change_lanes, open_earlier, change_staff, rent_equipment]
                  decision_date: "2026-11-05"
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
              llm_guided:
                summary: LLM-guided optimization method
                value:
                  optimization_method: llm_guided
                  levers: [move_staff, change_lanes, open_earlier, change_staff, rent_equipment]
                  decision_date: "2026-11-05"
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
      responses:
        "202":
          description: The optimization was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Optimization"
              example:
                id: opt_01JC9Y5N2B7C4D6F8G0H2J4K6M
                plan_id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                status: queued
                error: null
                request:
                  optimization_method: greedy
                  levers: [move_staff, change_lanes, open_earlier, change_staff, rent_equipment]
                  decision_date: "2026-11-05"
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify:
                    replications: 50
                    base_seed: 20261127
                progress: null
                starting_plan: null
                candidates: []
                history: []
                probes: []
                stop_reason: null
                llm: null
                created_at: "2026-11-05T08:00:00Z"
                started_at: null
                finished_at: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: >-
            The body fails the shape checks (`validation_failed`), the plan has
            validation errors (`plan_invalid`), or the plan breaks hard limits
            (`hard_limits_broken`). The `code` of each `hard_limits_broken`
            detail is the limit name. The method `llm_guided` fails with
            `optimization_method_unavailable` when the server has no OpenAI
            key. An unknown `optimization_method` is a `validation_failed`
            error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation_failed:
                  summary: The body fails a check
                  value:
                    error:
                      code: validation_failed
                      message: The request has invalid fields
                      details:
                        - field: event.schedule.doors_open
                          message: Must be a time in HH:MM format
                optimization_method_unavailable:
                  summary: The server has no OpenAI key
                  value:
                    error:
                      code: optimization_method_unavailable
                      message: The optimization method llm_guided is not available on this server
                      details:
                        - field: optimization_method
                          message: The server has no OpenAI key
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/plans/{plan_id}/optimizations:
