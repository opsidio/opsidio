          description: The `limit` or `cursor` query parameter is invalid (`validation_failed`).
  /v1/optimizations/{optimization_id}:
    parameters:
      - $ref: "#/components/parameters/OptimizationId"
    get:
      operationId: getOptimization
      summary: Get an optimization
      description: >-
        Returns the status, progress, and result of one optimization. The
        result holds `recommended` on the candidates and, for `llm_guided`,
        the `llm` block. Poll it after optimizePlan until the status is
        succeeded, failed, or cancelled. It changes nothing.
      tags: [optimizations]
      responses:
        "200":
          description: The optimization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Optimization"
              examples:
                succeeded:
                  $ref: "#/components/examples/Optimization"
                llm_guided:
                  $ref: "#/components/examples/OptimizationLlmGuided"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The optimization does not exist (`optimization_not_found`).
  /v1/optimizations/{optimization_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OptimizationId"
    post:
      operationId: cancelOptimization
      summary: Cancel an optimization
      description: >-
        Cancels an optimization. A queued optimization becomes cancelled at
        once. A running optimization gets a cancellation request and keeps the
        status running until the worker ends it; poll getOptimization until
        the status is succeeded, failed, or cancelled. Call it when the search
        is no longer needed.
      tags: [optimizations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The cancelled optimization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Optimization"
              example:
                id: opt_01JC9Y5N2B7C4D6F8G0H2J4K6M
                plan_id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                status: cancelled
                error: null
                request:
                  optimization_method: greedy
                  levers: [move_staff, change_lanes, open_earlier, change_staff, rent_equipment]
                  decision_date: "2026-11-05"
                  max_kept_moves: 200
                  time_limit_seconds: 600
                  verify: null
                progress: null
                starting_plan: null
                candidates: []
                history: []
                probes: []
                stop_reason: null
                llm: null
                created_at: "2026-11-05T08:00:00Z"
                started_at: null
                finished_at: "2026-11-05T08:00:03Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The optimization does not exist (`optimization_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            The optimization already ended (`optimization_finished`), or the
            Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The Idempotency-Key header is invalid (`validation_failed`).
