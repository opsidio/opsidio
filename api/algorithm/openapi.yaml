openapi: 3.1.0
info:
  title: Opsidio sandbox API
  version: 1.1.0
  description: >-
    Build an event entrance plan in parts, run it with the flow or des
    simulation method, and search for a better plan. Plan and output documents
    keep integer IDR amounts and "HH:MM" Asia/Jakarta clock times (ADR 0002).
servers:
  - url: http://127.0.0.1:8000
    description: Local
security:
  - ApiKeyAuth: []
tags:
  - name: health
    description: Service status.
  - name: presets
    description: Read-only venue and step presets that a plan can copy.
  - name: plans
    description: Editable plan documents and their steps and roles.
  - name: runs
    description: Simulation runs of a plan snapshot.
  - name: optimizations
    description: Queued searches for a better plan.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get service health
      description: >-
        Returns 200 while the service runs. It needs the API key, like every
        other operation. Call it to check that the service is up and that the
        key works. It changes nothing.
      tags: [health]
      responses:
        "200":
          description: The service runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/venue-presets:
    get:
      operationId: listVenuePresets
      summary: List venue presets
      description: >-
        Returns the ID, name, and summary of each venue preset. Call it to pick
        a preset for applyVenuePreset. It changes nothing.
      tags: [presets]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of venue presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePresetPage"
              example:
                data:
                  - id: tennis_indoor_senayan
                    name: Tennis Indoor Senayan
                    summary: Default lanes, gates, zones, and known problems of Tennis Indoor Senayan.
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The `limit` or `cursor` query parameter is invalid (`validation_failed`).
  /v1/venue-presets/{preset_id}:
    get:
      operationId: getVenuePreset
      summary: Get a venue preset
      description: >-
        Returns one venue preset with its full venue block and the sources that
        it names. Call it to inspect a venue before you apply it. It changes
        nothing.
      tags: [presets]
      parameters:
        - $ref: "#/components/parameters/PresetId"
      responses:
        "200":
          description: The venue preset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenuePreset"
              example:
                id: tennis_indoor_senayan
                name: Tennis Indoor Senayan
                summary: Default lanes, gates, zones, and known problems of Tennis Indoor Senayan.
                venue:
                  id: tennis_indoor_senayan
                  name: Tennis Indoor Senayan
                  layout:
                    zones:
                      - id: zone_priority_queue
                        type: queue
                        area_m2: 64
                    service_points: []
                    gates: []
                    walking_paths: []
                    visitor_flow:
                      - order: 1
                        point: redemption_tent
                        required: true
                  known_problems: []
                sources:
                  gbk_venue:
                    title: GBK — Tennis Indoor venue page
                    url: https://gbk.id/venue/tennis-indoor-31
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The venue preset does not exist (`preset_not_found`).
  /v1/step-presets:
    get:
      operationId: listStepPresets
      summary: List step presets
      description: >-
        Returns the ID and name of each step preset. Call it to pick a step for
        applyStepPreset. It changes nothing.
      tags: [presets]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of step presets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepPresetPage"
              example:
                data:
                  - id: eticket_scan
                    name: E-ticket scan
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The `limit` or `cursor` query parameter is invalid (`validation_failed`).
  /v1/step-presets/{preset_id}:
    get:
      operationId: getStepPreset
      summary: Get a step preset
      description: >-
        Returns one step preset as a step. Call it to inspect a step before you
        apply it. It changes nothing.
      tags: [presets]
      parameters:
        - $ref: "#/components/parameters/PresetId"
      responses:
        "200":
          description: The step preset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Step"
              example:
                id: wristband_check
                name: Wristband check at the gate
                applies_to: all_visitors
                time_per_person_seconds:
                  typical: 3
                  slow: 10
                exceptions:
                  - id: wrong_gate
                    share_percent: 2
                    outcome: redirect_to_correct_gate
                    extra_minutes: 0.5
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The step preset does not exist (`preset_not_found`).
  /v1/plans:
    post:
      operationId: createPlan
      summary: Create a plan
      description: >-
        Creates a plan from an empty object, part of a document, or a full
        document. Call it first; then fill the plan with the other plan
        operations. A new plan gets `schema_version` "0.1" and
        `meta.document` opsidio_event_input. Cross-part rules wait for
        validatePlan.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanDocument"
            example:
              event:
                schedule:
                  outer_area_open: "15:30"
                  doors_open: "17:30"
                  main_act: "19:45"
      responses:
        "201":
          description: The plan was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T07:52:38Z"
                document:
                  schema_version: "0.1"
                  meta:
                    document: opsidio_event_input
                  event:
                    schedule:
                      outer_area_open: "15:30"
                      doors_open: "17:30"
                      main_act: "19:45"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The document fails the shape checks (`validation_failed`).
    get:
      operationId: listPlans
      summary: List plans
      description: >-
        Returns plans without their documents, newest first. Call it to find a
        plan ID, including the candidate plans of optimizations. It changes
        nothing.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of plans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanPage"
              example:
                data:
                  - id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                    parent_plan_id: null
                    optimization_id: null
                    candidate_kind: null
                    created_at: "2026-11-05T07:52:38Z"
                    updated_at: "2026-11-05T08:10:02Z"
                next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The `limit` or `cursor` query parameter is invalid (`validation_failed`).
  /v1/plans/{plan_id}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getPlan
      summary: Get a plan
      description: >-
        Returns the plan with its whole document. Call it to read the current
        steps, roles, and other parts. No operation reads one step or one
        role. It changes nothing.
      tags: [plans]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:10:02Z"
                document:
                  schema_version: "0.1"
                  event: {}
                  venue: {}
                  process_steps: {}
                  staff: {}
                  constraints: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
    patch:
      operationId: updatePlan
      summary: Update a plan
      description: >-
        Applies a JSON Merge Patch (RFC 7386) to the plan document. A list in
        the patch replaces the whole list, and null removes a part. Call it for
        every part except steps and roles, which have their own operations. The
        server validates the merged document.
      tags: [plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanPatch"
            example:
              constraints:
                budget:
                  staff_cap_idr: 65000000
                  equipment_cap_idr: 40000000
      responses:
        "200":
          description: The changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:10:02Z"
                document:
                  schema_version: "0.1"
                  constraints:
                    budget:
                      staff_cap_idr: 65000000
                      equipment_cap_idr: 40000000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: >-
            The merged document fails the shape checks (`validation_failed`), or
            the patch touches `process_steps.steps` or `staff.roles`
            (`use_item_endpoint`).
    delete:
      operationId: deletePlan
      summary: Delete a plan
      description: >-
        Deletes the plan with its runs and optimizations. Candidate plans of
        its optimizations stay, with the old `parent_plan_id`. Call it only
        when no optimization of the plan is queued or running.
      tags: [plans]
      responses:
        "204":
          description: The plan was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: An optimization of the plan is queued or running (`optimization_active`).
  /v1/plans/{plan_id}/steps:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: createStep
      summary: Add a step to a plan
      description: >-
        Adds one step to `process_steps.steps`. Call it to define a process
        step that lanes use. It returns the whole plan. To copy a known step,
        call applyStepPreset instead.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Step"
            example:
              id: body_search
              name: Body search
              applies_to: all_visitors
              time_per_person_seconds:
                typical: 7
                slow: 20
              exceptions:
                - id: wand_alarm
                  share_percent: 3
                  outcome: secondary_check
                  extra_minutes: 1
      responses:
        "201":
          description: The step was added. The body is the changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:10:02Z"
                document:
                  schema_version: "0.1"
                  process_steps:
                    steps:
                      - id: body_search
                        name: Body search
                        applies_to: all_visitors
                        time_per_person_seconds:
                          typical: 7
                          slow: 20
                        exceptions:
                          - id: wand_alarm
                            share_percent: 3
                            outcome: secondary_check
                            extra_minutes: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            The plan already has a step with that ID (`step_exists`), or the
            Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The step fails the shape checks (`validation_failed`).
  /v1/plans/{plan_id}/steps/{step_id}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - $ref: "#/components/parameters/StepId"
    patch:
      operationId: updateStep
      summary: Update a step
      description: >-
        Applies a JSON Merge Patch (RFC 7386) to one step. The step ID cannot
        change. Call it to change step times or exceptions. It returns the
        whole plan.
      tags: [plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepPatch"
            example:
              time_per_person_seconds:
                slow: 25
      responses:
        "200":
          description: The changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:12:40Z"
                document:
                  schema_version: "0.1"
                  process_steps:
                    steps:
                      - id: body_search
                        applies_to: all_visitors
                        time_per_person_seconds:
                          typical: 7
                          slow: 25
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the step (`step_not_found`) does not exist.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The changed step fails the shape checks (`validation_failed`).
    delete:
      operationId: deleteStep
      summary: Delete a step
      description: >-
        Removes one step from `process_steps.steps`. Lanes that still name the
        step get an `unknown_reference` error in validatePlan. Call it to drop
        a step from the process.
      tags: [plans]
      responses:
        "204":
          description: The step was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the step (`step_not_found`) does not exist.
  /v1/plans/{plan_id}/roles:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: createRole
      summary: Add a role to a plan
      description: >-
        Adds one role to `staff.roles`, with its counts, rates, and
        assignments. Call it to staff lanes and duties. It returns the whole
        plan.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
            example:
              id: accessibility_escort
              name: Accessibility escort
              count: 2
              gender:
                female: 1
                male: 1
              shift: sh_doors
              can_do: [assisted_entry]
              rate_idr_per_shift: 300000
              overtime_idr_per_hour: 45000
              pool_limit_total: 3
              extra_staff_lead_time_days: 3
              assignment:
                - point: gate_priority
                  duty: escort
                  count: 2
      responses:
        "201":
          description: The role was added. The body is the changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:14:00Z"
                document:
                  schema_version: "0.1"
                  staff:
                    roles:
                      - id: accessibility_escort
                        count: 2
                        gender:
                          female: 1
                          male: 1
                        shift: sh_doors
                        can_do: [assisted_entry]
                        rate_idr_per_shift: 300000
                        pool_limit_total: 3
                        extra_staff_lead_time_days: 3
                        assignment:
                          - point: gate_priority
                            duty: escort
                            count: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan does not exist (`plan_not_found`).
        "409":
          $ref: "#/components/responses/Conflict"
          description: >-
            The plan already has a role with that ID (`role_exists`), or the
            Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The role fails the shape checks (`validation_failed`).
  /v1/plans/{plan_id}/roles/{role_id}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
      - $ref: "#/components/parameters/RoleId"
    patch:
      operationId: updateRole
      summary: Update a role
      description: >-
        Applies a JSON Merge Patch (RFC 7386) to one role. The role ID cannot
        change, and a list in the patch, such as `assignment`, replaces the
        whole list. Call it to change counts, rates, or assignments. It
        returns the whole plan.
      tags: [plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolePatch"
            example:
              count: 3
              gender:
                female: 2
      responses:
        "200":
          description: The changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:15:00Z"
                document:
                  schema_version: "0.1"
                  staff:
                    roles:
                      - id: accessibility_escort
                        count: 3
                        gender:
                          female: 2
                          male: 1
                        shift: sh_doors
                        can_do: [assisted_entry]
                        rate_idr_per_shift: 300000
                        pool_limit_total: 3
                        extra_staff_lead_time_days: 3
                        assignment:
                          - point: gate_priority
                            duty: escort
                            count: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the role (`role_not_found`) does not exist.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The changed role fails the shape checks (`validation_failed`).
    delete:
      operationId: deleteRole
      summary: Delete a role
      description: >-
        Removes one role from `staff.roles`. Call it to drop a role and all of
        its assignments.
      tags: [plans]
      responses:
        "204":
          description: The role was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the role (`role_not_found`) does not exist.
  /v1/plans/{plan_id}/apply-venue-preset:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: applyVenuePreset
      summary: Apply a venue preset to a plan
      description: >-
        Replaces the whole `venue` block with the preset's venue, and adds the
        preset's sources to `sources`. Call it to load a known venue with its
        default lanes and known problems. It returns the whole plan.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPresetRequest"
            example:
              preset_id: tennis_indoor_senayan
      responses:
        "200":
          description: The changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                id: pln_01JC9W3K8Q6Y2M4T5R7V9X1Z3B
                parent_plan_id: null
                optimization_id: null
                candidate_kind: null
                created_at: "2026-11-05T07:52:38Z"
                updated_at: "2026-11-05T08:16:00Z"
                document:
                  schema_version: "0.1"
                  venue:
                    id: tennis_indoor_senayan
                    name: Tennis Indoor Senayan
                  sources:
                    gbk_venue:
                      title: GBK — Tennis Indoor venue page
                      url: https://gbk.id/venue/tennis-indoor-31
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
          description: The plan (`plan_not_found`) or the venue preset (`preset_not_found`) does not exist.
        "409":
          $ref: "#/components/responses/Conflict"
          description: The Idempotency-Key was used with a different body (`idempotency_key_reused`).
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: The body fails the shape checks (`validation_failed`).
  /v1/plans/{plan_id}/apply-step-preset:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: applyStepPreset
      summary: Apply a step preset to a plan
      description: >-
        Adds the preset's step to `process_steps.steps`. It adds only the step
        that the caller asks for. Call it once for each known step that the
        lanes need. It returns the whole plan.
      tags: [plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyPresetRequest"
            example:
              preset_id: eticket_scan
      responses:
        "200":
          description: The changed plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
